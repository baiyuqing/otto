name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# CI builds from scratch every time apart from the dependency cache below, so
# incremental compilation only writes files nobody reads, and line tables are
# all a test failure's backtrace needs; full debuginfo roughly doubles what the
# test binaries cost to compile and link. Local builds keep Cargo's defaults.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify staged and historical detection
        env:
          GITLEAKS_TEST_REQUIRED: '1'
        run: node --test scripts/gitleaks.test.mjs
      - name: Scan full Git history (including documentation)
        run: gitleaks git --verbose --redact --ignore-gitleaks-allow

  # The build gates below always start, so a required status check always reports;
  # this job decides whether they have any work to do. A change that touches
  # only Markdown, `docs/`, or `LICENSE` cannot affect the build or the tests,
  # so every step of every gate is skipped and they finish green without
  # installing a toolchain. Anything else, including a workflow edit, runs the
  # full gate.
  changes:
    name: Classify the change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the change is documentation only
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          # Every unusual range - a new branch, a force push that dropped the
          # old tip, an empty diff - falls through to running the full gate.
          docs_only=false
          files=""
          if [ -n "$BASE" ] &&
            [ "$BASE" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "$BASE^{commit}" 2>/dev/null
          then
            files="$(git diff --name-only "$BASE" "$HEAD")"
          fi
          # A Markdown file under `crates/` or `testdata/` is a fixture, not
          # documentation: the skill and agent loaders discover `SKILL.md` and
          # `AGENT.md` by name, so those paths always run the gate.
          if [ -n "$files" ] &&
            ! printf '%s\n' "$files" | grep -qvE '(^docs/|^LICENSE$|\.md$)' &&
            ! printf '%s\n' "$files" | grep -qE '^(crates|testdata)/'
          then
            docs_only=true
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          {
            echo "docs_only: \`$docs_only\`"
            echo
            echo "Changed files:"
            echo '```'
            printf '%s\n' "${files:-(range unavailable)}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    name: macOS acceptance
    needs: changes
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - name: Select standalone command line tools
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          xcode-select --print-path
      - name: Install the pinned Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install
          rustc --version
      - name: Restore the cargo dependency cache
        id: cargo-cache
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: v2-${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          # A pull request that changes Cargo.lock starts from main's older
          # dependencies. A push to main starts clean, so the cache it saves
          # holds only what the current lock file builds and does not grow.
          restore-keys: ${{ github.event_name == 'pull_request' && format('v2-{0}-cargo-', runner.os) || '' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: '24'
      # wasm-pack runs the wasm-bindgen it finds on PATH when the version
      # matches the one Cargo.lock pins; otherwise it compiles its own copy
      # from source on every run.
      - name: Resolve wasm tool versions
        if: needs.changes.outputs.docs_only != 'true'
        id: wasm-tools
        run: echo "wasm_bindgen=$(node scripts/ci-cache.mjs lock-version wasm-bindgen)" >> "$GITHUB_OUTPUT"
      - name: Restore wasm-pack and wasm-bindgen-cli
        if: needs.changes.outputs.docs_only != 'true'
        id: wasm-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
          key: ${{ runner.os }}-wasm-pack-0.15.0-wasm-bindgen-${{ steps.wasm-tools.outputs.wasm_bindgen }}
      - name: Install wasm-pack and wasm-bindgen-cli
        if: needs.changes.outputs.docs_only != 'true'
        env:
          WASM_BINDGEN: ${{ steps.wasm-tools.outputs.wasm_bindgen }}
        run: |
          wasm-pack --version 2>/dev/null | grep -qx 'wasm-pack 0.15.0' ||
            cargo install wasm-pack --version 0.15.0 --locked --force
          wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen $WASM_BINDGEN" ||
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked --force
      # Saved before the gate runs, so a failing gate does not throw away the
      # three minutes these took to compile.
      - name: Save wasm-pack and wasm-bindgen-cli
        if: needs.changes.outputs.docs_only != 'true' && steps.wasm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
          key: ${{ runner.os }}-wasm-pack-0.15.0-wasm-bindgen-${{ steps.wasm-tools.outputs.wasm_bindgen }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          go-version-file: chat-connector/go.mod
          cache-dependency-path: chat-connector/go.sum
      # rust-fmt and rust-lint run in the macOS lint job below, at the same
      # time as this one; `make check` is check-tests plus those two.
      - name: Run make check-tests
        id: gate
        if: needs.changes.outputs.docs_only != 'true'
        run: make check-tests
      # A run saves only when no cache matched its key exactly, which happens
      # once per Cargo.lock, root Cargo.toml or toolchain change; a later run
      # with the same key restores it and never saves again. Main's cache is
      # the one every pull request restores; a pull request's own copy is
      # visible only to that pull request. A failed gate still saves, after
      # the test build is finished, so that one failing test does not leave
      # every following run building its dependencies cold; a build that
      # cannot finish is not saved. The workspace's own output is removed
      # first: it changes with every commit.
      - name: Finish the test build for the cargo cache
        id: finish-build
        if: failure() && needs.changes.outputs.docs_only != 'true' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.gate.outcome == 'failure'
        run: cargo test --workspace --no-run
      - name: Drop workspace build output from the cargo cache
        id: prune
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && steps.cargo-cache.outputs.cache-hit != 'true' && (steps.gate.outcome == 'success' || steps.finish-build.outcome == 'success') }}
        run: node scripts/ci-cache.mjs prune
      - name: Save the cargo dependency cache
        if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: v2-${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

  # Clippy compiles every workspace crate a second time, in check mode, so
  # running it here instead of inside `make check` takes it off the macOS
  # critical path. It keeps its own dependency cache: the acceptance job's
  # cache has no check-mode metadata for the dependencies.
  lint:
    name: macOS lint
    needs: changes
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - name: Select standalone command line tools
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          xcode-select --print-path
      - name: Install the pinned Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install
          rustc --version
      - name: Restore the clippy dependency cache
        id: cargo-cache
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: v2-${{ runner.os }}-clippy-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('v2-{0}-clippy-', runner.os) || '' }}
      - name: Run make rust-fmt rust-lint
        id: gate
        if: needs.changes.outputs.docs_only != 'true'
        run: make rust-fmt rust-lint
      # Saved under the same rules as the acceptance job's cache. A failed
      # lint still saves once a clippy run without -D warnings finishes the
      # dependency build.
      - name: Finish the clippy build for the cargo cache
        id: finish-build
        if: failure() && needs.changes.outputs.docs_only != 'true' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.gate.outcome == 'failure'
        run: cargo clippy --workspace --all-targets
      - name: Drop workspace build output from the cargo cache
        id: prune
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && steps.cargo-cache.outputs.cache-hit != 'true' && (steps.gate.outcome == 'success' || steps.finish-build.outcome == 'success') }}
        run: node scripts/ci-cache.mjs prune
      - name: Save the clippy dependency cache
        if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: v2-${{ runner.os }}-clippy-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

  check-linux:
    name: Linux checks
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install
          rustc --version
      - name: Restore the cargo dependency cache
        id: cargo-cache
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: v2-${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ github.event_name == 'pull_request' && format('v2-{0}-cargo-', runner.os) || '' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          go-version-file: chat-connector/go.mod
          cache-dependency-path: chat-connector/go.sum
      # Linux has no Seatbelt, so this is the Rust gate without the sandbox
      # conformance suite; core WASM compatibility remains
      # checked here. Browser build/tests live in otto-plus.
      - name: Run make check-linux
        id: gate
        if: needs.changes.outputs.docs_only != 'true'
        run: make check-linux
      # A run saves only when no cache matched its key exactly, which happens
      # once per Cargo.lock, root Cargo.toml or toolchain change; a later run
      # with the same key restores it and never saves again. Main's cache is
      # the one every pull request restores; a pull request's own copy is
      # visible only to that pull request. A failed gate still saves, after
      # the test build is finished, so that one failing test does not leave
      # every following run building its dependencies cold; a build that
      # cannot finish is not saved. The workspace's own output is removed
      # first: it changes with every commit.
      - name: Finish the test build for the cargo cache
        id: finish-build
        if: failure() && needs.changes.outputs.docs_only != 'true' && steps.cargo-cache.outputs.cache-hit != 'true' && steps.gate.outcome == 'failure'
        run: cargo test --workspace --no-run
      - name: Drop workspace build output from the cargo cache
        id: prune
        if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && steps.cargo-cache.outputs.cache-hit != 'true' && (steps.gate.outcome == 'success' || steps.finish-build.outcome == 'success') }}
        run: node scripts/ci-cache.mjs prune
      - name: Save the cargo dependency cache
        if: ${{ !cancelled() && steps.prune.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: v2-${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
