[workspace]
resolver = "3"
members = ["crates/otto-core", "crates/otto"]

[workspace.package]
edition = "2024"
version = "0.4.8"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Exact versions. otto-core must stay buildable for wasm32-unknown-unknown, so
# every dependency it takes is default-features = false unless a feature is
# required by name.
[workspace.dependencies]
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", default-features = false, features = ["alloc", "serde"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "raw_value"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", default-features = false }
tokio-util = { version = "=0.7.20", default-features = false }
wasm-bindgen = "=0.2.129"
wasm-bindgen-test = "=0.3.79"
regex = "=1.13.1"
# Native-only. macOS has no safe-wrapper crate for renamex_np(RENAME_EXCL),
# openat/mkdirat/fstatat with O_NOFOLLOW, so the store calls them through libc.
libc = "=0.2.191"
# SHA-256 for the workspace directory key. No hash lives in std.
sha2 = { version = "=0.11.1", default-features = false }
# base64url for the OAuth PKCE challenge, the state parameter and the JWT
# payload in `otto::auth`. Already in the lock file as a transitive dependency.
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
# Native-only. nix gives the openat/readlinkat walk the workspace boundary needs
# and the setpgid/killpg process-group control the sandbox drivers need.
nix = { version = "=0.31.3", default-features = false, features = ["fs", "dir", "process", "signal", "user"] }
tempfile = "=3.27.0"
# Native-only HTTP transport for the provider client. rustls only, no
# native-tls: `rustls` uses the aws-lc-rs provider and rustls-platform-verifier,
# which checks certificates with the macOS trust evaluation (Security.framework)
# and with the system root store on Linux. `stream` gives the chunked body
# reader the SSE assembler needs; `query` and `form` give
# `RequestBuilder::query` (client API) and `::form` (OAuth token request).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "query", "form"] }
# `TryStreamExt::try_next` over the reqwest byte stream.
futures-util = { version = "=0.3.34", default-features = false }
# otto-core only parses TOML (config loading is resolution-only there); the
# native crate adds "display" for Save's serialization.
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# Native-only HTML to Markdown conversion for the `web_fetch` tool.
htmd = "=0.5.6"
# Native-only legacy charset decoding (GBK, Shift_JIS, windows-1252) for fetched pages.
encoding_rs = "=0.8.42"
# WHATWG URL parsing for base_url validation, mirroring net/url's checks.
url = "=2.5.8"
# HTTP routing for `otto serve`. hyper and tower arrive transitively at the
# versions axum pins; nothing depends on them by name.
axum = "=0.8.9"
# Dev-only: `ServiceExt::oneshot` drives the router in-process, so the route
# contract tests need no listening socket.
tower = { version = "=0.5.3", features = ["util"] }
# Native-only embedded Rust database. The "fts" feature lets the memory
# importer open v2 memory databases, which contain a `USING fts` index.
turso = { version = "=0.8.3", default-features = false, features = ["fts"] }
otto-core = { path = "crates/otto-core" }

# The memory, usage, task and workflow stores run every query through Turso,
# and its unoptimized SQL compiler and VM made those tests about three times
# slower than they are at opt-level 2. These crates are dependencies, so the
# extra compile time is paid once per Turso version, not per change. Otto's
# own crates stay unoptimized.
# Release binary size. Measured 2026-10-25 on macOS arm64 with Rust 1.99.0:
# the default release profile produced a 65,633,504-byte `otto` (52,751,472
# stripped); this profile produces 31,954,496 bytes, and a clean release build
# takes about 260 s instead of 170 s on an Apple M4. `panic` stays `unwind`
# although `abort` would reach 25,443,120 bytes: the TUI restores the terminal
# from `Drop` guards, which run only while unwinding, and a panicking tokio task
# must end that task, not the resident `otto serve` process. `strip =
# "symbols"` removes 7.3 MB of symbol table over `"debuginfo"` and drops
# function names from `RUST_BACKTRACE` output; panic messages keep file:line.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = "symbols"

[profile.dev.package.turso_core]
opt-level = 2

[profile.dev.package.turso_parser]
opt-level = 2

[profile.dev.package.turso_ext]
opt-level = 2
