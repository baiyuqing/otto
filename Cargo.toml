[workspace]
resolver = "3"
members = [
    "crates/otto-core",
    "crates/otto-platform",
    "crates/otto",
    "crates/otto-client",
    "crates/otto-terminal",
    "crates/otto-server",
    "crates/otto-acp",
    "crates/otto-eval",
    "crates/otto-cli",
]

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Exact versions. Every dependency is default-features = false unless a
# feature is required by name.
[workspace.dependencies]
# Native plugin computation only; Lua 5.4 is statically vendored (MIT).
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored", "serialize", "send"] }
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", default-features = false, features = ["alloc", "serde"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "raw_value"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", default-features = false }
tokio-util = { version = "=0.7.20", default-features = false }
regex = "=1.13.1"
# Substring search for the egress secret scan; already in the lockfile through regex.
memchr = { version = "=2.8.3", default-features = false, features = ["std"] }
# Native-only. macOS has no safe-wrapper crate for renamex_np(RENAME_EXCL),
# openat/mkdirat/fstatat with O_NOFOLLOW, so the store calls them through libc.
libc = "=0.2.191"
# SHA-256 for the workspace directory key. No hash lives in std.
sha2 = { version = "=0.11.1", default-features = false }
# base64url for the OAuth PKCE challenge, the state parameter and the JWT
# payload in `otto::auth`. Already in the lock file as a transitive dependency.
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
# Native-only. nix gives the openat/readlinkat walk the workspace boundary needs
# and the setpgid/killpg process-group control the sandbox drivers need.
nix = { version = "=0.31.3", default-features = false, features = ["fs", "dir", "process", "signal", "user"] }
tempfile = "=3.27.0"
# Native-only HTTP transport for the provider client. rustls only, no
# native-tls: `rustls-no-provider` keeps rustls-platform-verifier, which checks
# certificates with the macOS trust evaluation (Security.framework) and with
# the system root store on Linux, and leaves the crypto provider to the rustls
# features the workspace enables: `ring`, through tokio-rustls below. The
# `rustls` feature would add aws-lc-rs as a second provider. `stream` gives
# the chunked body reader the SSE assembler needs; `query` and `form` give
# `RequestBuilder::query` (client API) and `::form` (OAuth token request).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "query", "form"] }
# `TryStreamExt::try_next` over the reqwest byte stream.
futures-util = { version = "=0.3.34", default-features = false }
# otto-core only parses TOML (config loading is resolution-only there); the
# native crate adds "display" for Save's serialization.
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
# Native-only HTML to Markdown conversion for the `web_fetch` tool.
htmd = "=0.5.6"
# Native-only legacy charset decoding (GBK, Shift_JIS, windows-1252) for fetched pages.
encoding_rs = "=0.8.44"
# WHATWG URL parsing for base_url validation, mirroring net/url's checks.
url = "=2.5.8"
# HTTP routing for `otto serve`. hyper and tower arrive transitively at the
# versions axum pins; nothing depends on them by name.
axum = "=0.8.9"
# Dev-only: `ServiceExt::oneshot` drives the router in-process, so the route
# contract tests need no listening socket.
tower = { version = "=0.5.3", features = ["util"] }
# Native-only server-side TLS for `otto serve --listen` on a non-loopback
# address. `ring` is the one rustls crypto provider in the workspace, for this
# listener and for reqwest's client (`crate::tls_provider` installs it as the
# process default). Its build script compiled its C and assembly in 2.8 s where
# aws-lc-sys took 16.7 s; the clean dev build went from 65.0 s to 58.1 s
# (`cargo build --timings`, 2026-11-01, macOS arm64, 10 cores). ring has no
# post-quantum key exchange, so TLS 1.3 negotiates X25519 or P-256. `rustls`
# and its `pki_types` are reached through this crate's re-export.
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
# Embedded SQLite, compiled from the bundled C source.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache"] }
otto-core = { path = "crates/otto-core" }
otto-platform = { path = "crates/otto-platform" }
otto = { path = "crates/otto" }
otto-client = { path = "crates/otto-client" }
otto-terminal = { path = "crates/otto-terminal" }
otto-server = { path = "crates/otto-server" }
otto-acp = { path = "crates/otto-acp" }
otto-eval = { path = "crates/otto-eval" }

# Release binary size. Measured 2026-10-25 on macOS arm64 with Rust 1.99.0:
# the default release profile produced a 65,633,504-byte `otto` (52,751,472
# stripped); this profile produces 25,443,120 bytes, and a clean release build
# takes about 260 s instead of 170 s on an Apple M4. `panic = "abort"` saves
# 6.5 MB over `unwind`. A panic then ends the process with SIGABRT and no
# `Drop` runs; `cli::panic_cleanup` kills registered child process groups and
# resets terminal input modes first (ratatui's hook restores raw mode and the
# alternate screen). Tests ignore this setting and still unwind. `strip =
# "symbols"` removes 7.3 MB of symbol table over `"debuginfo"` and drops
# function names from `RUST_BACKTRACE` output; panic messages keep file:line.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = "symbols"

# Dev-profile debuginfo. Measured 2026-11-01 on macOS arm64 with Rust 1.99.1
# (`cargo build --timings`, 10 cores): a clean dev build took 58.1 s with the
# default `debug = 2` and 52.2 s with line tables only; a one-line body edit in
# crates/otto/src/cli/acp.rs rebuilt in 8.5 s (otto codegen 3.4 s, bin link
# 1.7 s) against 6.1 s (1.8 s, 0.8 s). Backtraces and panic locations keep
# file:line; a debugger shows no local variables or types. A developer who
# needs them sets `[profile.dev] debug = 2` in `~/.cargo/config.toml`, which
# overrides this manifest profile.
[profile.dev]
debug = "line-tables-only"
