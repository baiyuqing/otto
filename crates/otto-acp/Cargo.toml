[package]
name = "otto-acp"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
otto.workspace = true
otto-core.workspace = true
otto-server.workspace = true
otto-client.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "fs", "net"] }
tokio-util.workspace = true
# ACP v1 message types for `otto acp`. The default feature only adds JSON
# Schema generation. The crate enables serde_json's `preserve_order`, so every
# serde_json map in a native workspace build keeps insertion order (see
# docs/development.md).
agent-client-protocol-schema = { version = "=1.15.1", default-features = false }

[dev-dependencies]
otto = { workspace = true, features = ["fault-injection", "test-support"] }
tempfile.workspace = true
