[package]
name = "otto-client"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
otto.workspace = true
otto-core.workspace = true
otto-platform.workspace = true
otto-session.workspace = true
# The client can call an in-process axum `Router` instead of a socket.
axum.workspace = true
tower.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
otto = { workspace = true, features = ["test-support"] }
chrono = { workspace = true, features = ["clock", "std"] }
tokio = { workspace = true, features = ["rt", "macros", "net"] }
tempfile.workspace = true
