[package]
name = "otto-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "I/O-free contracts, wire formats and agent loop of Otto"
repository = "https://github.com/baiyuqing/otto"
readme = "README.md"
rust-version = "1.100"
keywords = ["agent", "llm", "ai", "tool-calling", "session"]
categories = ["asynchronous", "data-structures"]

[lints]
workspace = true

[features]
default = ["conformance"]
# Public behavioural checks of the Session and Mailbox ports; see
# `otto_core::conformance`.
conformance = []

# Ranges, not exact pins: a git-dependency consumer resolves its own versions;
# the workspace `Cargo.lock` pins the otto binary.
[dependencies]
async-trait = "0.1.92"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde"] }
regex = "1.13.1"
# Substring search for the egress secret scan; already in the lockfile through regex.
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std", "raw_value"] }
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2.0.21"
tokio-util = { version = "0.7.20", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std", "display"] }
url = "2.5.8"

# tokio is the test runtime only.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
