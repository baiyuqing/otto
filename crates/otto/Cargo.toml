[package]
name = "otto"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
otto-core.workspace = true
async-trait.workspace = true
futures-util.workspace = true
reqwest.workspace = true
# Native-only: the store timestamps records from the wall clock and converts
# filesystem times, neither of which otto-core's wasm-safe chrono can do.
chrono = { workspace = true, features = ["clock", "std"] }
libc.workspace = true
nix.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "signal"] }
tokio-util.workspace = true
# Save() serializes, so the native crate needs "display" on top of otto-core's
# parse-only feature set.
toml = { workspace = true, features = ["display"] }

[dev-dependencies]
tempfile.workspace = true
# `start_paused` drives the bash timeout deterministically without real waits.
# `net` gives the in-file provider tests a loopback TCP origin server.
tokio = { workspace = true, features = ["test-util", "net"] }
