[package]
name = "otto"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test-only fault injection (`otto::faults`). Off in every shipped build; the
# integration tests turn it on through the self dev-dependency below.
fault-injection = []
# Test-only scaffolding (`otto::fixtures`): offline configuration, controllers
# on temporary directories and the scripted provider. Off in every shipped
# build; the tests of dependent crates turn it on through a dev-dependency.
# It implies `fault-injection` because the scripted provider runs on
# `otto::faults::http`.
test-support = ["fault-injection"]

[dependencies]
# Static shell analysis for approval rules and review facts (`approval::shell`).
# C grammar, compiled by the build script.
tree-sitter = "=0.27.1"
tree-sitter-bash = "=0.25.1"
otto-core.workspace = true
mlua.workspace = true
async-trait.workspace = true
base64.workspace = true
axum.workspace = true
futures-util.workspace = true
reqwest.workspace = true
htmd.workspace = true
encoding_rs.workspace = true
url.workspace = true
# The store timestamps records from the wall clock and converts filesystem
# times; otto-core's chrono has neither feature because it does no I/O.
chrono = { workspace = true, features = ["clock", "std"] }
libc.workspace = true
nix.workspace = true
regex.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
# Validate custom tool schemas offline, including local references and constraints.
jsonschema = { version = "=0.60.2", default-features = false }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "signal", "net"] }
tokio-util.workspace = true
# Save() serializes, so the native crate needs "display" on top of otto-core's
# parse-only feature set.
toml = { workspace = true, features = ["display"] }
# The terminal frontend (`otto::tui`); only this crate uses them, so they are
# not workspace dependencies.
pulldown-cmark = { version = "=0.13.6", default-features = false }
# `all-widgets`/`macros`/`underline-color` are dropped: this TUI uses only the
# widgets ratatui-widgets ships unconditionally (Paragraph, Block, List,
# Table, Scrollbar), not the calendar widget or the `layout!` macro.
# `unstable-rendered-line-info` gives `Paragraph::line_count`, used to
# auto-scroll the transcript to its last wrapped line;
# safe to depend on here since the version is pinned exactly, so it cannot
# change under us.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "=0.29.0"
# The composer wraps and places its caret by display width (see
# `tui::render::composer_lines`). Already in the tree as ratatui's own
# width source; depending on it directly keeps the two in agreement.
unicode-width = "=0.2.3"
tower.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
# Gives the integration tests `otto::faults` and `otto::fixtures` without
# compiling them into a default build.
otto = { path = ".", features = ["fault-injection", "test-support"] }
# `start_paused` drives the bash timeout deterministically without real waits.
# `net` gives the in-file provider tests a loopback TCP origin server.
tokio = { workspace = true, features = ["test-util", "net"] }
[[test]]
name = "mcp_stdio"
path = "tests/mcp_stdio.rs"
harness = false
