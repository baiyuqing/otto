[workspace]

[package]
name = "otto-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Otto macOS desktop shell"

[lib]
name = "otto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "otto-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
