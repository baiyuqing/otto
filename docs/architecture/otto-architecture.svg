<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="otto-architecture-title otto-architecture-desc" id="otto-architecture-root">
      <title id="otto-architecture-title">Otto — Code architecture</title>
      <desc id="otto-architecture-desc">Terminal, browser, chat and embedded hosts enter Otto through native adapters. Shared application control and runtime assembly connect native capabilities, durable state and providers to a WebAssembly-safe core.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #otto-architecture-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-soft: #7a8399; --color-rule: #bfc0c0; --color-accent: #eb6c36; --font-sans: 'Geist', system-ui, sans-serif; --font-serif: 'Instrument Serif', Georgia, serif; --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #otto-architecture-root { color: var(--color-ink); font-family: var(--font-sans); }
      #otto-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #otto-architecture-root text { fill: var(--color-ink); font-family: var(--font-sans); }
      #otto-architecture-root .diagram-title { font-family: var(--font-serif); font-size: 40px; font-weight: 400; }
      #otto-architecture-root .name { font-size: 16px; font-weight: 600; }
      #otto-architecture-root .detail { font-size: 12px; fill: var(--color-muted); }
      #otto-architecture-root .code { font-family: var(--font-mono); font-size: 10px; fill: var(--color-muted); }
      #otto-architecture-root .tag { font-family: var(--font-mono); font-size: 8px; letter-spacing: 1.4px; fill: var(--color-muted); }
      #otto-architecture-root .band { fill: #ececec; stroke: var(--color-rule); stroke-width: 1; }
      #otto-architecture-root .divider { stroke: var(--color-rule); stroke-width: 1; }
      #otto-architecture-root .connector { stroke: var(--color-muted); stroke-width: 1.2; fill: none; marker-end: url(#otto-architecture-arrow); }
      #otto-architecture-root .diagram-container { overflow: visible; }</style><marker id="otto-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker></defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>
      <text x="32" y="32" class="tag">OTTO / CODE ARCHITECTURE</text>
      <text x="32" y="72" class="diagram-title">One runtime. Every surface.</text>
      <text x="1248" y="68" text-anchor="end" class="detail">Local-first agent · Native Rust + a portable core</text>
      <path d="M 312 168 L 312 188" class="connector"/><path d="M 572 168 L 572 188" class="connector"/><path d="M 832 168 L 832 188" class="connector"/><path d="M 1092 168 L 1092 188" class="connector"/>
      <path d="M 712 248 L 712 268" class="connector"/><path d="M 712 340 L 712 360" class="connector"/><path d="M 712 484 L 712 504" class="connector"/><path d="M 712 564 L 712 584" class="connector"/>
      <text x="32" y="118" class="tag">01 / HOSTS</text><text x="32" y="140" class="name">Surfaces</text><text x="32" y="158" class="code">People + programs</text>
      <rect x="192" y="104" width="1056" height="64" rx="6" class="band"/><path d="M 452 116 L 452 156 M 712 116 L 712 156 M 972 116 L 972 156" class="divider"/>
      <text x="216" y="130" class="name">Terminal</text><text x="216" y="150" class="detail">TUI · REPL · Headless CLI</text>
      <text x="476" y="130" class="name">Browser</text><text x="476" y="150" class="detail">otto-plus · React + WASM</text>
      <text x="736" y="130" class="name">Telegram &amp; Feishu</text><text x="736" y="150" class="detail">otto-connect · Go client</text>
      <text x="996" y="130" class="name">Rust host</text><text x="996" y="150" class="detail">In-process embedding</text>
      <text x="32" y="202" class="tag">02 / ADAPTERS</text><text x="32" y="224" class="name">Entry points</text><text x="32" y="242" class="code">crates/otto</text>
      <rect x="192" y="188" width="1056" height="60" rx="6" class="band"/><path d="M 452 200 L 452 236 M 712 200 L 712 236 M 972 200 L 972 236" class="divider"/>
      <text x="216" y="214" class="name">CLI / TUI / Client</text><text x="216" y="234" class="code">cli/ · tui/ · client/</text>
      <text x="476" y="214" class="name">HTTP API + SSE</text><text x="476" y="234" class="code">server/ · otto serve</text>
      <text x="736" y="214" class="name">Agent Client Protocol</text><text x="736" y="234" class="code">acp/ · stdio / TCP</text>
      <text x="996" y="214" class="name">Embedding API</text><text x="996" y="234" class="code">embed::Otto</text>
      <text x="32" y="282" class="tag">03 / APPLICATION</text><text x="32" y="304" class="name">Control &amp; assembly</text><text x="32" y="322" class="code">crates/otto</text>
      <rect x="192" y="268" width="1056" height="72" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.2"/><path d="M 544 280 L 544 328 M 896 280 L 896 328" stroke="#eb6c36" stroke-opacity="0.28"/>
      <text x="216" y="294" class="name">Application controller</text><text x="216" y="314" class="detail">Sessions · turns · steering · wake</text><text x="216" y="330" class="code">app/ · Controller</text>
      <text x="568" y="294" class="name">Runtime composition</text><text x="568" y="314" class="detail">Startup · workspace admission · wiring</text><text x="568" y="330" class="code">runtime/ · Builder + Runner</text>
      <text x="920" y="294" class="name">Cross-workspace delivery</text><text x="920" y="314" class="detail">Broker · tasks · worktrees · handoff</text><text x="920" y="330" class="code">delivery/ · ParentToolSlot</text>
      <text x="32" y="374" class="tag">04 / NATIVE</text><text x="32" y="396" class="name">Capabilities</text><text x="32" y="414" class="code">Network · files · process</text>
      <rect x="192" y="360" width="1056" height="124" rx="6" class="band"/><path d="M 456 372 L 456 472 M 720 372 L 720 472 M 984 372 L 984 472" class="divider"/>
      <text x="216" y="386" class="name">Tools &amp; extensions</text><text x="216" y="408" class="detail">Workspace · Bash · Web · MCP</text><text x="216" y="428" class="detail">Skills · Plugins · Tool registry</text><text x="216" y="452" class="code">tool/ · sandbox/ · skill/</text><text x="216" y="468" class="code">plugin/ · mcp/</text>
      <text x="480" y="386" class="name">Memory &amp; reflection</text><text x="480" y="408" class="detail">Pluggable memory services</text><text x="480" y="428" class="detail">Reviewed memory · skill checks</text><text x="480" y="452" class="code">memory/ · reflection/</text><text x="480" y="468" class="code">skill/check_* · usage/</text>
      <text x="744" y="386" class="name">Tasks &amp; automation</text><text x="744" y="408" class="detail">Sub-agents · durable workflows</text><text x="744" y="428" class="detail">Schedules · plans · reminders</text><text x="744" y="452" class="code">subagent/ · workflow/</text><text x="744" y="468" class="code">schedule/ · tool/update_plan</text>
      <text x="1008" y="386" class="name">Authority &amp; resilience</text><text x="1008" y="408" class="detail">Smart approval · AUTO / YOLO</text><text x="1008" y="428" class="detail">Stream recovery · deadlines · metrics</text><text x="1008" y="452" class="code">approval/ · failover/</text><text x="1008" y="468" class="code">retry/ · log · metrics</text>
      <text x="32" y="518" class="tag">05 / BOUNDARIES</text><text x="32" y="540" class="name">State &amp; services</text><text x="32" y="558" class="code">Injected ports</text>
      <rect x="192" y="504" width="1056" height="60" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/><path d="M 544 516 L 544 552 M 896 516 L 896 552" class="divider"/>
      <text x="216" y="530" class="name">Durable state</text><text x="216" y="550" class="code">Turso SQL · POSIX sessions · turn queue</text>
      <text x="568" y="530" class="name">Mailbox &amp; memory adapters</text><text x="568" y="550" class="code">repository ports · transactions · receipts</text>
      <text x="920" y="530" class="name">Model providers</text><text x="920" y="550" class="code">bounded retry · interrupted-output boundary</text>
      <text x="32" y="598" class="tag">06 / PORTABLE</text><text x="32" y="620" class="name">WASM-safe core</text><text x="32" y="638" class="code">crates/otto-core</text>
      <rect x="192" y="584" width="1056" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><path d="M 544 596 L 544 644 M 896 596 L 896 644" class="divider"/>
      <text x="216" y="610" class="name">Agent loop &amp; context</text><text x="216" y="630" class="detail">Turns · compaction · operations</text><text x="216" y="646" class="code">agent/ · session/ · operation</text>
      <text x="568" y="610" class="name">Portable service contracts</text><text x="568" y="630" class="detail">Models · tools · approvals · config</text><text x="568" y="646" class="code">memory/ · mailbox/ · provider/</text>
      <text x="920" y="610" class="name">Wire &amp; stream codecs</text><text x="920" y="630" class="detail">Frontend DTOs · retry boundaries</text><text x="920" y="646" class="code">wire/ · openaicompat/ · responses/</text>
      <path d="M 32 676 L 1248 676" class="divider"/><text x="32" y="698" class="code">Top → bottom: entry → composition → capability binding · Core has no native I/O · otto-plus also consumes the core through WASM</text><text x="1248" y="698" class="code" text-anchor="end">Source: a37f68b</text>
    </svg>
