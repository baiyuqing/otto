<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>otto trace viewer</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; --card:#f7f7f7; --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --err:#dc2626; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#161616; --fg:#e8e8e8; --muted:#999; --line:#333; --card:#1f1f1f; --accent:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .muted { color:var(--muted); }
  main { padding:0 20px 40px; max-width:1100px; }
  .summary { display:flex; gap:24px; flex-wrap:wrap; margin:16px 0; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; min-width:120px; }
  .stat .n { font-size:22px; font-weight:600; }
  .stat .l { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  tr.call { cursor:pointer; }
  tr.call:hover { background:var(--card); }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; font-weight:600; }
  .s2 { color:var(--ok); } .s4,.s5 { color:var(--err); } .serr { color:var(--err); }
  .detail td { background:var(--card); }
  .tabs { display:flex; gap:8px; margin-bottom:8px; }
  .tabs button { font:inherit; padding:4px 12px; border:1px solid var(--line); background:var(--bg); border-radius:6px; cursor:pointer; color:var(--fg); }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; max-height:460px; margin:0; white-space:pre-wrap; word-break:break-word; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .bar { height:8px; background:var(--accent); border-radius:4px; }
  .ctxrow { display:grid; grid-template-columns:minmax(90px,260px) 1fr 70px; gap:10px; align-items:center; margin:3px 0; }
  .ctxrow .role { font-size:12px; color:var(--muted); word-break:break-all; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:40px; text-align:center; color:var(--muted); margin:24px 0; }
  input[type=file]{ font:inherit; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>otto trace viewer</h1>
  <input type="file" id="file" accept=".jsonl,.json,.txt">
  <span class="muted">or drop a <code>~/.otto/traces/*.jsonl</code> file anywhere</span>
</header>
<main>
  <div id="empty" class="drop">Load an OTTO_TRACE JSONL file to inspect calls, tokens, and context.</div>
  <div id="summary" class="summary" hidden></div>
  <table id="tbl" hidden>
    <thead><tr><th>#</th><th>time</th><th>status</th><th>ms</th><th>model</th><th>msgs</th><th>prompt→compl tok</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
const $ = s => document.querySelector(s);

// --- pure parsing start ---
// Otto traces two wire shapes: chat-completions (internal/provider/openaicompat)
// and the Responses API (internal/provider/openairesponses). Both are decoded
// here. Tested by scripts/trace-viewer.test.mjs.
function parseSSE(raw){
  // Returns {text, usage} reconstructed from a raw SSE stream.
  let text = "", usage = null;
  for (const line of (raw||"").split("\n")){
    const t = line.trim();
    if (!t.startsWith("data:")) continue;
    const payload = t.slice(5).trim();
    if (payload === "[DONE]" || payload === "") continue;
    let obj; try { obj = JSON.parse(payload); } catch { continue; }
    if (obj.usage) usage = obj.usage;
    const ch = obj.choices && obj.choices[0];
    if (ch){
      const d = ch.delta || {};
      if (d.content) text += d.content;
      if (ch.message && ch.message.content) text += ch.message.content; // non-stream fallback
      continue;
    }
    // Responses API: text arrives as output_text deltas, usage rides on the
    // terminal response.completed event, tool calls as function_call items.
    if (obj.type === "response.output_text.delta" && typeof obj.delta === "string") text += obj.delta;
    if (obj.response && obj.response.usage) usage = obj.response.usage;
    const item = obj.type === "response.output_item.done" ? obj.item : null;
    if (item && item.type === "function_call") text += `\n[tool call] ${item.name}(${item.arguments||""}) call_id=${item.call_id||item.id||"?"}\n`;
  }
  return { text, usage };
}

// requestMessages normalizes a request body into {role, content} rows. The
// Responses API sends `input` items whose non-message entries (tool output,
// function calls) carry a type instead of a role.
function requestMessages(req){
  if (Array.isArray(req.messages)) return req.messages;
  if (Array.isArray(req.input)) return req.input.map(it => ({ ...it, role: it.role || it.type || "item", content: it.content ?? it }));
  return [];
}

// msgLabel names a context row. Tool traffic keeps its call_id so a call can be
// matched to the output that answers it, in either wire shape.
function msgLabel(m){
  const id = m.call_id ?? m.tool_call_id ?? (Array.isArray(m.tool_calls) ? m.tool_calls.map(c => c.id).join(",") : null);
  return m.role + (m.name ? ` ${m.name}` : "") + (id ? ` ${id}` : "");
}

// requestSystem returns the system prompt under either name.
function requestSystem(req){
  return req.system ?? req.instructions ?? null;
}
// --- pure parsing end ---

function safeParse(s){ try { return JSON.parse(s); } catch { return null; } }
function bytes(n){ return n>=1024 ? (n/1024).toFixed(1)+" KB" : n+" B"; }
function statusClass(s){ if(!s) return "serr"; return "s"+String(s)[0]; }

function render(records){
  records.sort((a,b)=>(a.seq||0)-(b.seq||0));
  const rows = $("#rows"); rows.innerHTML = "";
  let totTok=0, totMs=0, calls=records.length;
  for (const rec of records){
    const req = safeParse(rec.req_body) || {};
    const { text, usage } = parseSSE(rec.resp_body);
    const msgs = requestMessages(req);
    const pt = usage ? (usage.prompt_tokens ?? usage.input_tokens ?? "") : "";
    const ct = usage ? (usage.completion_tokens ?? usage.output_tokens ?? "") : "";
    if (usage) totTok += (usage.total_tokens ?? ((usage.prompt_tokens||0)+(usage.completion_tokens||0)));
    totMs += rec.duration_ms||0;

    const tr = document.createElement("tr");
    tr.className = "call";
    const status = rec.error ? "ERR" : (rec.status||"?");
    tr.innerHTML = `<td>${rec.seq??""}</td><td>${(rec.ts||"").replace("T"," ").replace(/\.\d+Z?$/,"")}</td>`+
      `<td class="${statusClass(rec.status)}"><span class="pill">${status}</span></td>`+
      `<td>${rec.duration_ms??""}</td><td>${req.model||"—"}</td><td>${msgs.length}</td>`+
      `<td>${pt!==""?pt:"—"}${ct!==""?" → "+ct:""}</td>`;
    rows.appendChild(tr);

    const detail = document.createElement("tr");
    detail.className = "detail"; detail.hidden = true;
    const td = document.createElement("td"); td.colSpan = 7; detail.appendChild(td);
    td.appendChild(buildDetail(rec, req, msgs, text, usage));
    rows.appendChild(detail);
    tr.addEventListener("click", ()=>{ detail.hidden = !detail.hidden; });
  }

  $("#summary").innerHTML =
    stat(calls,"calls") + stat(totTok.toLocaleString(),"tokens") + stat((totMs/1000).toFixed(1)+"s","total wall") ;
  $("#summary").hidden = false; $("#tbl").hidden = false; $("#empty").hidden = true;
}
function stat(n,l){ return `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`; }

function buildDetail(rec, req, msgs, text, usage){
  const wrap = document.createElement("div");
  const tabs = document.createElement("div"); tabs.className = "tabs";
  const panes = {};
  const mk = (name, node)=>{ panes[name]=node; node.hidden=true; wrap.appendChild(node);
    const b=document.createElement("button"); b.textContent=name;
    b.onclick=()=>{ for(const k in panes) panes[k].hidden=true; node.hidden=false;
      [...tabs.children].forEach(x=>x.classList.remove("active")); b.classList.add("active"); };
    tabs.appendChild(b); return b; };

  // Context breakdown: per-message byte size (the real context sent this turn).
  const ctx = document.createElement("div");
  const sizes = msgs.map(m=>({ label:msgLabel(m), n:new Blob([typeof m.content==="string"?m.content:JSON.stringify(m.content)]).size }));
  const sysVal = requestSystem(req);
  const sys = (sysVal!=null) ? new Blob([typeof sysVal==="string"?sysVal:JSON.stringify(sysVal)]).size : 0;
  const tools = req.tools ? new Blob([JSON.stringify(req.tools)]).size : 0;
  const max = Math.max(1, sys, tools, ...sizes.map(s=>s.n));
  const line=(label,n)=>`<div class="ctxrow"><span class="role">${label}</span><div class="bar" style="width:${Math.max(2,100*n/max)}%"></div><span class="muted">${bytes(n)}</span></div>`;
  ctx.innerHTML = (sys?line("system",sys):"") + (tools?line(`tools (${req.tools.length})`,tools):"") +
    sizes.map((s,i)=>line(`${i}. ${s.label}`, s.n)).join("");

  const reqPane = document.createElement("div");
  reqPane.innerHTML = `<pre>${esc(JSON.stringify(req, null, 2))}</pre>`;
  const respPane = document.createElement("div");
  // Only the token counts; the Responses API also nests a large per-item
  // attribution blob under usage that is not worth rendering here.
  const tok = usage ? { input: usage.prompt_tokens ?? usage.input_tokens, output: usage.completion_tokens ?? usage.output_tokens, total: usage.total_tokens } : null;
  respPane.innerHTML = (tok?`<p class="muted">usage: ${esc(JSON.stringify(tok))}</p>`:"")+
    `<pre>${esc(text || "(no assistant text — tool call or empty)")}</pre>`;
  const rawPane = document.createElement("div");
  rawPane.innerHTML = `<p class="muted">${esc(rec.method||"")} ${esc(rec.url||"")}${rec.error?` — error: ${esc(rec.error)}`:""}</p>`+
    `<pre>${esc(rec.resp_body||"")}</pre>`;

  mk("context", ctx); mk("request", reqPane); mk("response", respPane); mk("raw SSE", rawPane);
  tabs.firstChild.click();
  const out=document.createElement("div"); out.appendChild(tabs); out.appendChild(wrap); return out;
}
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function load(txt){
  const records = txt.split("\n").map(l=>l.trim()).filter(Boolean).map(safeParse).filter(Boolean);
  if (!records.length){ $("#empty").textContent = "No JSONL records found in that file."; return; }
  render(records);
}
$("#file").addEventListener("change", e=>{ const f=e.target.files[0]; if(f) f.text().then(load); });
document.addEventListener("dragover", e=>e.preventDefault());
document.addEventListener("drop", e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) f.text().then(load); });
</script>
</body>
</html>
