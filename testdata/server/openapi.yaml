openapi: 3.1.0
info:
  title: Otto agent server
  version: "1"
  description: >
    HTTP+JSON+SSE frontend for otto serve. One app.Controller per session;
    turns stream as Server-Sent Events. See
    docs/specs/2026-09-03-agent-server-design.md.
servers:
  - url: http://otto
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >
        Required on every /v1/ path when otto serve listens on TCP
        (--listen): the per-process token printed at startup, sent as
        "Authorization: Bearer <token>". Missing or wrong tokens get 401 with
        WWW-Authenticate: Bearer. The Unix-socket listener has no token.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_input_tokens:
          type: integer
    UsageSummary:
      type: object
      properties:
        requests:
          type: integer
        reported_requests:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_input_tokens:
          type: integer
        cache_hit_rate:
          type: number
      required: [requests, reported_requests, input_tokens, output_tokens, cached_input_tokens, cache_hit_rate]
    DailyUsage:
      type: object
      properties:
        date:
          type: string
          format: date
        requests:
          type: integer
        reported_requests:
          type: integer
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_input_tokens:
          type: integer
      required: [date, requests, reported_requests, input_tokens, output_tokens, cached_input_tokens]
    UsageAnalysis:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/UsageSummary"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyUsage"
      required: [summary, daily]
    Sandbox:
      type: object
      properties:
        mode:
          type: string
        network:
          type: string
        bash_available:
          type: boolean
        summary:
          type: string
    ApprovalResponse:
      type: object
      properties:
        prompt:
          type: string
      required: [prompt]
    Compaction:
      type: object
      description: The compaction_completed event payload, also returned by POST /v1/sessions/{id}/compact.
      properties:
        checkpoint_id:
          type: string
        reason:
          type: string
          enum: [manual, threshold, overflow]
        tokens_before:
          type: integer
        estimated_tokens_after:
          type: integer
        automatic:
          type: boolean
        usage:
          $ref: "#/components/schemas/Usage"
        noop:
          type: boolean
      required: [reason, tokens_before, estimated_tokens_after, automatic, noop]
    SessionTurn:
      type: [object, "null"]
      properties:
        id:
          type: string
        trigger:
          type: string
          enum: [user, task]
        status:
          type: string
          enum: [running, ok, error, canceled]
    Session:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        workspace:
          type: string
        provider:
          type: string
        profile:
          type: string
        model:
          type: string
        thinking:
          type: string
        context_window:
          type: integer
        usage:
          $ref: "#/components/schemas/Usage"
        context_input_tokens:
          type: integer
        sandbox:
          $ref: "#/components/schemas/Sandbox"
        turn:
          $ref: "#/components/schemas/SessionTurn"
      required: [id, workspace, provider, model, thinking, sandbox, turn]
    SessionListRow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        workspace:
          type: string
        provider:
          type: string
        model:
          type: string
        open:
          type: boolean
      required: [id, open]
    SessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionListRow"
      required: [sessions]
    Message:
      type: object
      description: otto_core::model::Message; see crates/otto-core/src/model.rs for the full shape.
    TurnSummary:
      type: object
      properties:
        id:
          type: string
        trigger:
          type: string
          enum: [user, task]
        status:
          type: string
          enum: [running, ok, error, canceled]
        error:
          type: string
        text:
          type: string
        usage:
          $ref: "#/components/schemas/Usage"
        usage_present:
          type: boolean
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
      required: [id, trigger, status, text, usage, usage_present, started_at]
    Task:
      type: object
      description: app::Task; see crates/otto/src/app/tasks.rs for the full shape.
      properties:
        id:
          type: string
        name:
          type: string
        agent:
          type: string
        description:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        steps:
          type: integer
        tool_calls:
          type: integer
        last_tool:
          type: string
        last_text:
          type: string
        usage:
          $ref: "#/components/schemas/Usage"
        usage_present:
          type: boolean
        result:
          type: string
        error:
          type: string
      required: [id, agent, description, status, created_at, steps, tool_calls, usage, usage_present]
    TaskList:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
      required: [tasks]
    Timer:
      type: object
      description: tool::remind::StoredReminder; the record the session sidecar stores.
      properties:
        id:
          type: string
        fire_at:
          type: string
          format: date-time
        message:
          type: string
      required: [id, fire_at, message]
    TimerList:
      type: object
      properties:
        timers:
          type: array
          items:
            $ref: "#/components/schemas/Timer"
      required: [timers]
    McpServer:
      type: object
      description: server::mcp::McpServer; see crates/otto/src/server/mcp.rs for the full shape.
      properties:
        name:
          type: string
        transport:
          type: string
          enum: [stdio, http]
        protocol_version:
          type: [string, "null"]
        state:
          type: string
          enum: [connected, disabled, needs_login, failed]
        tools:
          type: integer
        error:
          type: [string, "null"]
      required: [name, transport, protocol_version, state, tools, error]
    McpServerList:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/McpServer"
      required: [servers]
    TaskWithHistory:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            history:
              type: array
              items:
                $ref: "#/components/schemas/Message"
          required: [history]
    WireEvent:
      type: object
      description: >
        One SSE frame's data payload; shape depends on the event's type
        (see docs/specs/2026-09-03-agent-server-design.md#wire-events).
      properties:
        type:
          type: string
          enum:
            - agent_started
            - agent_finished
            - text_delta
            - tool_call_started
            - tool_call_finished
            - provider_usage
            - compaction_started
            - compaction_planned
            - compaction_completed
            - compaction_warning
            - memory_warning
            - agent_error
            - notification
        turn_id:
          type: string
        task_id:
          type: string
        text:
          type: string
        tool_name:
          type: string
        tool_call_id:
          type: string
        tool_args: {}
        result:
          type: object
          properties:
            content:
              type: string
            is_error:
              type: boolean
        usage:
          $ref: "#/components/schemas/Usage"
        usage_present:
          type: boolean
        compaction:
          $ref: "#/components/schemas/Compaction"
        plan:
          type: object
        error:
          type: string
      required: [type]
    Healthz:
      type: object
      properties:
        status:
          type: string
        sessions_open:
          type: integer
      required: [status, sessions_open]
    Info:
      type: object
      properties:
        workspace:
          type: string
        provider:
          type: string
        profile:
          type: string
        model:
          type: string
        thinking:
          type: string
        sandbox:
          type: string
        profiles:
          type: array
          items:
            type: string
      required: [workspace, provider, profile, model, thinking, sandbox, profiles]
    WorkflowStep:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [agent, approval]}
        agent: {type: string}
        prompt: {type: string}
        needs:
          type: array
          items: {type: string}
        status:
          type: string
          enum: [pending, ready, running, waiting, succeeded, failed, canceled, interrupted]
        attempt: {type: integer}
        result: {type: string}
        error: {type: string}
        transcript_path: {type: string}
      required: [id, kind, agent, prompt, needs, status, attempt, result, error, transcript_path]
    WorkflowRun:
      type: object
      properties:
        id: {type: string}
        workflow: {type: string}
        workspace: {type: string}
        profile: {type: string}
        provider: {type: string}
        model: {type: string}
        input: {type: string}
        status:
          type: string
          enum: [running, waiting, paused, succeeded, failed, canceled]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
      required: [id, workflow, workspace, profile, provider, model, input, status, steps]
    WorkflowRequest:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        step_id: {type: string}
        prompt: {type: string}
        status: {type: string, enum: [pending, approved, rejected, canceled]}
      required: [id, run_id, step_id, prompt, status]
    WorkflowView:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/WorkflowRun"
        requests:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRequest"
      required: [run, requests]
    WorkflowList:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRun"
      required: [runs]
    WorkflowEvent:
      type: object
      properties:
        seq: {type: integer}
        run_id: {type: string}
        occurred_at: {type: string, format: date-time}
        kind: {type: string}
        step_id: {type: string}
        status: {type: string}
      required: [seq, run_id, occurred_at, kind, step_id, status]
  parameters:
    sessionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    turnID:
      name: turn_id
      in: path
      required: true
      schema:
        type: string
    taskID:
      name: task_id
      in: path
      required: true
      description: Task id or name.
      schema:
        type: string
    timerID:
      name: timer_id
      in: path
      required: true
      description: Timer id, as `remind` and the list route report it.
      schema:
        type: string
    approvalID:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
    workflowID:
      name: id
      in: path
      required: true
      schema:
        type: string
    workflowRequestID:
      name: id
      in: path
      required: true
      schema:
        type: string
    after:
      name: after
      in: query
      required: false
      description: Resume the event stream after this seq number.
      schema:
        type: integer
        minimum: 0
paths:
  /v1/sessions:
    post:
      summary: Create or resume a session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resume:
                  type: string
                  description: An existing session id. Omit to create a new session.
      responses:
        "201":
          description: New session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "200":
          description: An already-open session, resumed or already tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: resume id not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List sessions (disk sessions merged with open sessions)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
  /v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: Get an open session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Rename an open session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "200":
          description: Renamed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid or missing name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A turn is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Cancel any active turn and close the session
      responses:
        "204":
          description: Closed
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/history:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: Session message history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/approvals/{approval_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/approvalID"
    post:
      summary: Approve one exact elevated Bash command
      responses:
        "200":
          description: Approved; submit the returned prompt as the next turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Approval unavailable, unknown, expired, or a turn is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/turns:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Start a turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: May be empty when image is present.
                image:
                  type: object
                  properties:
                    data:
                      type: string
                      description: Base64-encoded PNG, JPEG, or WebP bytes.
                    mime_type:
                      type: string
                      enum: [image/png, image/jpeg, image/webp]
                  required: [data, mime_type]
                stream:
                  type: boolean
                  default: true
              required: [text]
      responses:
        "200":
          description: >
            stream:true (default) returns a text/event-stream of WireEvent
            frames starting at seq 0; stream:false waits for the turn to
            finish and returns its TurnSummary.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/WireEvent"
            application/json:
              schema:
                $ref: "#/components/schemas/TurnSummary"
        "400":
          description: Invalid turn text or image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A turn is already active for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The turn could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/turns/{turn_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/turnID"
    get:
      summary: Get a turn's summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnSummary"
        "404":
          description: Session or turn not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/turns/{turn_id}/events:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/turnID"
      - $ref: "#/components/parameters/after"
    get:
      summary: Stream (or resume streaming) a turn's events over SSE
      description: Also honors the Last-Event-ID header as an alternative to ?after=.
      responses:
        "200":
          description: text/event-stream of WireEvent frames
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/WireEvent"
        "400":
          description: after is not a non-negative integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session or turn not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/turns/{turn_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/turnID"
    post:
      summary: Cancel a running turn
      responses:
        "202":
          description: Cancellation requested
        "404":
          description: Session or turn not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: List a session's sub-agent tasks, in creation order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/taskID"
    get:
      summary: Get a task, plus its child session's history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWithHistory"
        "404":
          description: Session or task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/tasks/{task_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/taskID"
    post:
      summary: Cancel a running task
      responses:
        "200":
          description: Canceled; returns the task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Session or task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Task already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/timers:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: List the session's outstanding timers, soonest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimerList"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/timers/{timer_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/timerID"
    post:
      summary: Cancel an outstanding timer
      responses:
        "200":
          description: Canceled; returns the timer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timer"
        "404":
          description: Session or timer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/mcp:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: List the session's MCP servers and their connection state, in configuration order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerList"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/compact:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Compact the session's context now
      description: >
        Runs one manual compaction and returns its result once it finishes;
        no events are streamed. Refused while a turn is running, and turns
        are refused while the compaction runs. Closing the request cancels
        the compaction.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                focus:
                  type: string
                  description: Optional guidance for what the summary should preserve
      responses:
        "200":
          description: >
            Compaction finished (noop:true when there was nothing to compact).
            The body is empty when the compaction was cancelled by process
            shutdown, since there is no result to report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compaction"
        "400":
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: turn_active (a turn or compaction is running) or compaction_failed (the previous context is still in effect)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sandbox/reload:
    post:
      summary: Re-read the sandbox configuration and apply it to the running process
      description: >
        Applies the current [sandbox] configuration to the running process
        without restarting otto. read_paths, network, and driver take effect;
        allow_env changes and a sandbox that was unavailable at startup still
        require a restart and are reported as a failure. One sandbox serves
        every session, so the reload is refused while any session has a turn in
        flight.
      responses:
        "200":
          description: The sandbox state now in effect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "409":
          description: A turn is active, or the reload failed and the previous sandbox is still in effect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Sandbox reload is not available in this process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/workflows:
    get:
      summary: List durable workflow runs for the workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
        "501":
          description: Workflow runtime unavailable
    post:
      summary: Start a durable workflow run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                input: {type: string}
              required: [name]
      responses:
        "201":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "409":
          description: Invalid definition or runtime conflict
        "501":
          description: Workflow runtime unavailable
  /v1/workflows/{id}:
    parameters:
      - $ref: "#/components/parameters/workflowID"
    get:
      summary: Get one durable workflow run
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "404":
          description: Run not found
  /v1/workflows/{id}/events:
    parameters:
      - $ref: "#/components/parameters/workflowID"
      - $ref: "#/components/parameters/after"
    get:
      summary: Replay durable workflow events after one sequence number
      responses:
        "200":
          description: Current event suffix; reconnect with the last event id to poll again
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/WorkflowEvent"
  /v1/workflows/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/workflowID"
    post:
      summary: Resume a run, optionally retrying one interrupted step
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                retry: {type: string}
      responses:
        "200":
          description: Resume accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "409":
          description: Run cannot be resumed
  /v1/workflows/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/workflowID"
    post:
      summary: Cancel a durable workflow run
      responses:
        "200":
          description: Run canceled after active attempts stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "409":
          description: Run already finished
  /v1/workflows/requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/workflowRequestID"
    post:
      summary: Approve one durable workflow gate
      responses:
        "200":
          description: Gate approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "409":
          description: Request conflict
  /v1/workflows/requests/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/workflowRequestID"
    post:
      summary: Reject one durable workflow gate
      responses:
        "200":
          description: Gate rejected and run canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "409":
          description: Request conflict
  /v1/info:
    get:
      summary: Process-level static info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /v1/usage:
    get:
      summary: Aggregate persisted provider token usage
      parameters:
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
        "500":
          description: Usage store unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/usage/daily:
    get:
      summary: Aggregate persisted provider token usage by UTC day
      parameters:
        - name: days
          in: query
          required: false
          description: Inclusive UTC day range, default 30.
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAnalysis"
        "400":
          description: Invalid day range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Usage store unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/openapi.yaml:
    get:
      summary: This document
      responses:
        "200":
          description: OK
          content:
            application/yaml: {}
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
  /metrics:
    get:
      summary: Prometheus text exposition
      responses:
        "200":
          description: OK
          content:
            text/plain: {}
