        - name: before
          in: query
          required: false
          schema:
            type: string
          description: An exclusive created_at cursor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRowList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/tasks/{parent_session}/{task_id}:
    parameters:
      - name: parent_session
        in: path
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get one task row from tasks.db, plus its child session's history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRowDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/workflows:
    get:
      summary: List durable workflow runs for the workspace, newest first
      parameters:
        - name: workspace
          in: query
          required: false
          description: Workspace to list; defaults to the startup workspace.
          schema:
            type: string
        - $ref: "#/components/parameters/workflowLimit"
        - $ref: "#/components/parameters/workflowBefore"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
        "400":
          description: Invalid page limit
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Workflow store unavailable
        "501":
          description: Workflow runtime unavailable
    post:
      summary: Start a durable workflow run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                input: {type: string}
              required: [name]
      responses:
        "201":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "400":
          description: Invalid definition or input
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No workflow has that name
        "409":
          description: Runtime conflict
        "503":
          description: Workflow store unavailable
        "501":
          description: Workflow runtime unavailable
  /v1/workflows/{id}:
    parameters:
      - $ref: "#/components/parameters/workflowID"
    get:
      summary: Get one durable workflow run
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Run not found
  /v1/workflows/{id}/events:
    parameters:
      - $ref: "#/components/parameters/workflowID"
      - $ref: "#/components/parameters/after"
    get:
      summary: Replay durable workflow events after one sequence number
      responses:
        "200":
          description: Current event suffix; reconnect with the last event id to poll again
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/WorkflowEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/workflows/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/workflowID"
    post:
      summary: Resume a run, optionally retrying one interrupted step
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                retry: {type: string}
      responses:
        "200":
          description: Resume accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "400":
          description: Invalid request
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Run cannot be resumed
        "503":
          description: Workflow store unavailable
  /v1/workflows/{id}/fork:
    parameters:
      - $ref: "#/components/parameters/workflowID"
    post:
      summary: Fork a durable workflow run from a committed step boundary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                after_step: {type: string}
              required: [after_step]
      responses:
        "201":
          description: Fork created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "400":
          description: Invalid request
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Step is not a committed success boundary
        "503":
          description: Workflow store unavailable
  /v1/workflows/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/workflowID"
    post:
      summary: Cancel a durable workflow run
      responses:
        "200":
          description: Run canceled after active attempts stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "400":
          description: Invalid request
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Run already finished
        "503":
          description: Workflow store unavailable
  /v1/workflows/requests/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/workflowRequestID"
    post:
      summary: Approve one durable workflow gate
      responses:
        "200":
          description: Gate approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "400":
          description: Invalid request
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Request conflict
        "503":
          description: Workflow store unavailable
  /v1/workflows/requests/{id}/reject:
    parameters:
      - $ref: "#/components/parameters/workflowRequestID"
    post:
      summary: Reject one durable workflow gate and cancel the run
      responses:
        "200":
          description: Gate rejected; the run is canceled and its in-flight attempts stop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowView"
        "400":
          description: Invalid request
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Request conflict
        "503":
          description: Workflow store unavailable
  /v1/workspaces:
    get:
      summary: List loaded workspaces, startup first then by path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceList"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Load a workspace, or return it if already loaded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path: {type: string}
                trust:
                  type: boolean
                  default: false
                  description: >-
                    When path is outside the startup workspace, the configured
                    roots, and every trusted directory, record it as trusted in
                    the config file (the same write as otto trust) and then load
                    it. Ignored for a path that is already admitted.
              required: [path]
      responses:
        "201":
          description: Newly loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEntry"
        "200":
          description: Already loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEntry"
        "400":
          description: Not an absolute, existing directory
        "403":
          description: Outside the startup workspace, configured roots, and trusted directories, and trust was not requested Also `forbidden` when the client may not perform this operation.
        "500":
          description: Admitted, but opening it failed, or recording trust failed
    delete:
      summary: Unload a workspace and remove it from the persisted list
      description: >-
        path is canonicalized the same way POST does, without the root
        check, so an entry for a directory that no longer exists can still
        be removed by its literal, previously persisted string.
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unloaded, removed from the persisted list, or both
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: WORKSPACE_NOT_FOUND, neither loaded nor in the list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            WORKSPACE_IS_STARTUP for the startup workspace, or
            WORKSPACE_IN_USE for an open session or an active workflow run
            in that workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/workspaces/diff:
    get:
      summary: A read-only diff of the workspace's changes against HEAD
      description: >-
        Staged and unstaged changes, plus untracked files, in one list sorted
        by path. Writes nothing to the repository or the working tree.
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
          description: An admitted workspace path, loaded if not already. Defaults to the startup workspace.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDiff"
        "400":
          description: workspace not an absolute, existing directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: workspace is outside the startup workspace and configured roots Also `forbidden` when the client may not perform this operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: The workspace has no usable sandbox to run git through
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: A git command failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The git commands did not finish within the deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/fs/dirs:
    get:
      summary: List subdirectories for the folder picker
      description: >-
        Lists the directory's subdirectories, never its files. Names starting
        with a dot are left out. Only the user's home directory, the
        configured workspace roots, and their descendants can be listed; the
        check runs after symlinks are resolved.
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: An absolute directory path. Defaults to the first entry of roots (the home directory).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirListing"
        "400":
          description: INVALID_PATH, not an absolute path to an existing directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: PATH_NOT_ALLOWED, outside every browsable directory Also `forbidden` when the client may not perform this operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: BROWSE_UNAVAILABLE, the server has no browsable directories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Reading the directory failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/info:
    get:
      summary: Process-level static info
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/status:
    get:
      summary: Stream every open session's status over SSE
      description: >-
        Each event is a full snapshot: every open session in this process,
        sorted by workspace then id. The first snapshot is sent on connect;
        after that, one is sent whenever it differs from the last one sent on
        this connection. No id: field and no replay.
      responses:
        "200":
          description: text/event-stream of StatusSnapshot frames
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StatusSnapshot"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/usage:
    get:
      summary: Aggregate persisted provider token usage
      parameters:
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Usage store unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/usage/daily:
    get:
      summary: Aggregate persisted provider token usage by UTC day
      parameters:
        - name: days
          in: query
          required: false
          description: Inclusive UTC day range, default 30.
          schema:
            type: integer
            minimum: 1
            maximum: 365
        - name: session_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAnalysis"
        "400":
          description: Invalid day range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Usage store unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/openapi.yaml:
    get:
      summary: This document
      responses:
        "200":
          description: OK
          content:
            application/yaml: {}
        "403":
          $ref: "#/components/responses/Forbidden"
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Healthz"
  /metrics:
    get:
      summary: Prometheus text exposition
      responses:
        "200":
          description: OK
          content:
            text/plain: {}
