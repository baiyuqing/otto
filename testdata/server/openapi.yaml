  /v1/sessions/{id}/compact:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Compact the session's context now
      description: >
        Runs one manual compaction and returns its result once it finishes;
        no events are streamed. Refused while a turn is running, and turns
        are refused while the compaction runs. Closing the request cancels
        the compaction.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                focus:
                  type: string
                  description: Optional guidance for what the summary should preserve
      responses:
        "200":
          description: >
            Compaction finished (noop:true when there was nothing to compact).
            The body is empty when the compaction was cancelled by process
            shutdown, since there is no result to report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Compaction"
        "400":
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: turn_active (a turn is running or queued, or a compaction is running) or compaction_failed (the previous context is still in effect)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/wake-replies:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - name: after
        in: query
        required: false
        schema: { type: integer, minimum: 0 }
        description: Return only replies with a larger id
    get:
      summary: Texts the model wrote in wake turns of this session
      description: >
        A wake turn is the turn otto starts when a timer or sub-agent
        notification is due and no prompt is running. The assistant text it
        streamed is queued here when the turn ends without error and was not
        cancelled. Replies
        are read by id and not removed. At most the 20 newest are kept.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sandbox/reload:
    post:
      summary: Re-read the sandbox configuration and apply it to the running process
      description: >
        Applies the current [sandbox] configuration to every loaded
        workspace's own process sandbox, each through its own reloader,
        without restarting otto. read_paths, network, and driver take effect;
        allow_env changes and a sandbox that was unavailable at startup still
        require a restart and are reported as a failure. One sandbox serves
        every session in its workspace, so the reload is refused while any
        session in any loaded workspace has a turn in flight. With only the
        startup workspace loaded, the response is the plain Sandbox object,
        unchanged from before other workspaces could be loaded. With more
        than one workspace loaded, the response is a SandboxReload object,
        and a failure in any one workspace's reload fails the whole request
        with 409, naming which workspace failed and which ones were still
        reloaded.
      responses:
        "200":
          description: The sandbox state now in effect
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Sandbox"
                  - $ref: "#/components/schemas/SandboxReload"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A turn is active, or the reload failed for at least one workspace and its previous sandbox is still in effect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Sandbox reload is not available in this process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/sandbox/changes:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Write one sandbox configuration change and apply it
      description: >
        Adds a read path, sets the network mode or adds an excluded command in
        the [sandbox] table of the serve process's configuration file, then
        reloads the sandbox of every loaded workspace as POST /v1/sandbox/reload
        does. A read path is resolved to an absolute, symlink-free path first.
        Refused while any session has a turn in flight.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxChangeRequest"
      responses:
        "200":
          description: The change was written and applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxChange"
        "400":
          description: invalid_sandbox_change (bad JSON, unknown change, empty value, network other than allow or deny, or an unusable path)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: turn_active, sandbox_change_failed (for example the path is already readable, or the reload failed and the change was rolled back) or sandbox_reload_failed (another workspace failed to reload)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Sandbox changes are not available in this process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/schedule/claim:
    post:
      summary: Claim the scheduled items due for the web UI
      description: >
        Returns up to 10 ready items of origin web and holds them for 120 s.
        An item that is not confirmed through the delivered route in that time
        is returned by a later claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The claimed items, possibly none
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: s7
                        due_at:
                          type: integer
                          format: int64
                          description: Unix milliseconds; echo it in the delivered request.
                        text:
                          type: string
                      required: [id, due_at, text]
                required: [items]
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: The schedule store is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/schedule/{id}/delivered:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: s7
    post:
      summary: Confirm that the web UI showed a scheduled item
      description: Answers 200 also when the occurrence was already confirmed or is no longer current.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                due_at:
                  type: integer
                  format: int64
                  description: The due_at returned by the claim route, in Unix milliseconds.
              required: [due_at]
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
        "400":
          description: due_at is missing or out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The id is not of the form s<n>
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The schedule store is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
