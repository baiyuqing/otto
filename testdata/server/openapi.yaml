openapi: 3.1.0
info:
  title: Otto agent server
  version: "1"
  description: >
    HTTP+JSON+SSE frontend for otto serve. One app.Controller per session;
    turns stream as Server-Sent Events. See
    docs/specs/2026-09-03-agent-server-design.md.
servers:
  - url: http://otto
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >
        Required on every /v1/ path when otto serve listens on TCP
        (--listen): the per-process token printed at startup, or the value of
        OTTO_SERVER_TOKEN when that variable is set, sent as
        "Authorization: Bearer <token>". Missing or wrong tokens get 401 with
        WWW-Authenticate: Bearer. On a non-loopback listener (which requires
        [server].tls_cert, [server].tls_key and OTTO_SERVER_TOKEN) every path
        except GET /healthz needs the token, /metrics included. The
        Unix-socket listener has no token.
  schemas:
    InputId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9._:-]+$"
      description: >
        The client's stable id for one input. A retry with the same id in the
        same session is admitted once: while the server remembers it (its 256
        most recent ids per session) the original result is returned; once
        only the session transcript holds it, 409 duplicate_input. Unrelated
        to the X-Request-Id log-correlation header.
    InputSource:
      type: string
      enum: [unknown, tui, repl, one_shot, http, acp, connector, runtime, agent]
      description: >
        Application that produced an input. As InputProvenance.source it is
        confirmed by the accepting runtime; as client_source it is only a
        client's unverified claim.
    InputProvenance:
      type: object
      required: [source, transport, delivery]
      description: >
        Runtime-owned origin metadata for one user input, kept separate from
        the unchanged input text. It is descriptive only and never grants
        authority. Inputs recorded before provenance existed carry none.
      properties:
        source:
          $ref: "#/components/schemas/InputSource"
          description: Confirmed by the accepting runtime; http for every HTTP request.
        transport:
          type: string
          enum: [unknown, local, http, acp]
          description: Transport observed at the accepting runtime boundary.
        delivery:
          type: string
          enum: [direct, unknown, steering, queued]
          description: How this input reached its turn.
        client_source:
          $ref: "#/components/schemas/InputSource"
          description: The client's unverified application claim; absent when none was sent.
    ClientSource:
      $ref: "#/components/schemas/InputSource"
      description: >
        Optional unverified claim of the client application, such as tui for
        an attached terminal. Recorded as input_provenance.client_source; it
        never sets the confirmed source and grants no authority.
    SteeringMessage:
      type: object
      required: [id, text, status]
      properties:
        id:
          type: integer
          minimum: 1
          description: Transient identifier within the active run.
        text:
          type: string
          description: Exact guidance text accepted from the user.
        status:
          type: string
          enum: [queued, delivered, withdrawn, discarded]
          description: >-
            queued can be withdrawn; delivered is append-only session history;
            withdrawn and discarded were never delivered to the agent.
        input_id:
          type: string
          description: >-
            The input id the delivered user message carries: the client's
            input_id, or steer:<turn id>:<n>. Absent when the session keeps no
            journal.
    MemoryScope:
      type: object
      properties:
        namespace: {type: string, description: "user or workspace"}
        id: {type: string}
      required: [namespace, id]
    MemoryRecord:
      type: object
      properties:
        id: {type: string}
        scope: {$ref: "#/components/schemas/MemoryScope"}
        kind: {type: string}
        key: {type: string}
        text: {type: string}
        labels: {type: array, items: {type: string}}
        metadata: {type: object, additionalProperties: {type: string}}
        origin: {type: string, enum: [human, model, extractor, import, migration, unknown]}
        confidence: {type: number}
        revision: {type: integer}
        state: {type: string, enum: [active, needs_review, superseded, retracted]}
        state_reason: {type: string, description: "Why the record left the active state, else empty"}
        superseded_by: {type: string, description: "Replacement record id when superseded, else empty"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time, description: "Last content change; lifecycle writes keep it"}
        verified_at: {type: [string, "null"], format: date-time}
        review_at: {type: [string, "null"], format: date-time}
        expires_at: {type: [string, "null"], format: date-time}
        review_due: {type: boolean}
        effective: {type: boolean, description: "Active, unexpired and not due for review: normal recall may use it"}
      required: [id, scope, kind, key, text, labels, metadata, origin, confidence, revision, state, state_reason, superseded_by, created_at, updated_at, verified_at, review_at, expires_at, review_due, effective]
    MemoryRecordPage:
      type: object
      properties:
        records: {type: array, items: {$ref: "#/components/schemas/MemoryRecord"}}
        next_cursor: {type: string, description: "Empty on the last page"}
      required: [records, next_cursor]
    MemorySearchResult:
      type: object
      properties:
        records: {type: array, items: {$ref: "#/components/schemas/MemoryRecord"}}
      required: [records]
    MemoryRememberInput:
      type: object
      additionalProperties: false
      properties:
        scope: {type: string, enum: [user, workspace]}
        kind: {type: string, default: note}
        key: {type: string}
        text: {type: string, minLength: 1}
        review_in: {type: string, description: "Review deadline as an age from now: 30d, 12h or 45m"}
      required: [scope, text]
    MemoryStateInput:
      type: object
      additionalProperties: false
      properties:
        state: {type: string, enum: [active, needs_review, superseded, retracted]}
        superseded_by: {type: string, description: "Required for superseded and only for it; an active record in the same scope"}
        reason: {type: string}
        expected_revision: {type: integer, minimum: 1}
      required: [state]
    MemoryVerifyInput:
      type: object
      additionalProperties: false
      properties:
        review_in: {type: string, description: "Next review deadline as an age; omitted clears the deadline"}
        expected_revision: {type: integer, minimum: 1}
    MemoryRestoreInput:
      type: object
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 1}
        expected_revision: {type: integer, minimum: 1}
      required: [revision]
    MemoryProposeInput:
      type: object
      additionalProperties: false
      properties:
        evidence: {type: string, minLength: 1, description: "One evidence item with user trust; whitespace is collapsed"}
      required: [evidence]
    MemoryReviewInput:
      type: object
      additionalProperties: false
      properties:
        decision: {type: string, enum: [accept, reject]}
      required: [decision]
    MemoryTombstone:
      type: object
      properties:
        id: {type: string}
        scope: {$ref: "#/components/schemas/MemoryScope"}
        revision: {type: integer}
        forgotten_at: {type: string, format: date-time}
      required: [id, scope, revision, forgotten_at]
    MemoryForgotten:
      type: object
      properties:
        tombstone: {$ref: "#/components/schemas/MemoryTombstone"}
        previous_revision: {type: integer}
      required: [tombstone, previous_revision]
    MemoryHistory:
      type: object
      properties:
        revisions: {type: array, items: {$ref: "#/components/schemas/MemoryRecord"}}
        skipped:
          type: array
          items:
            type: object
            properties:
              file: {type: string}
              reason: {type: string}
            required: [file, reason]
      required: [revisions, skipped]
    MemoryDiff:
      type: object
      properties:
        from: {$ref: "#/components/schemas/MemoryRecord"}
        to: {$ref: "#/components/schemas/MemoryRecord"}
      required: [from, to]
    MemoryCandidate:
      type: object
      properties:
        id: {type: string}
        action: {type: string, enum: [create, update, forget, retract, supersede, correct, needs_review]}
        state: {type: string, enum: [pending, accepted, rejected]}
        target_id: {type: string, description: "The record the action changes; empty for create"}
        base_revision: {type: integer}
        kind: {type: string}
        key: {type: string}
        text: {type: string}
        reason: {type: string}
        origin: {type: string}
        scope: {$ref: "#/components/schemas/MemoryScope"}
        created_at: {type: string, format: date-time}
        advice: {type: string, description: "One-line review advice; omitted when there is none"}
        proposed: {$ref: "#/components/schemas/MemoryRecord"}
      required: [id, action, state, target_id, base_revision, kind, key, text, reason, origin, scope, created_at, proposed]
    MemoryCandidatePage:
      type: object
      properties:
        candidates: {type: array, items: {$ref: "#/components/schemas/MemoryCandidate"}}
        next_cursor: {type: string}
      required: [candidates, next_cursor]
    MemoryProposal:
      type: object
      properties:
        outcome: {type: string, enum: [proposed, no_change, rejected, unavailable]}
        candidate: {$ref: "#/components/schemas/MemoryCandidate"}
        detail: {type: string, description: "Explanation for no_change, or why it was rejected or unavailable"}
      required: [outcome]
    MemoryReviewResult:
      type: object
      properties:
        decision: {type: string, enum: [accept, reject]}
        candidate: {$ref: "#/components/schemas/MemoryCandidate"}
        record: {$ref: "#/components/schemas/MemoryRecord"}
        tombstone: {$ref: "#/components/schemas/MemoryTombstone"}
      required: [decision, candidate]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
      required: [error]
    Usage:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_input_tokens:
          type: integer
        cache_write_input_tokens:
          type: integer
          minimum: 0
          description: Newly cached input tokens included in input_tokens; omitted when not reported.
        cache_write_1h_input_tokens:
          type: integer
          minimum: 0
          description: One-hour cache writes, included in cache_write_input_tokens; omitted when not reported.
      required: [input_tokens, output_tokens]
    UsageSummary:
      type: object
      properties:
        usage_events:
          type: integer
          minimum: 0
        reported_usage_events:
          type: integer
          minimum: 0
        logical_operations:
          type: integer
          minimum: 0
        actual_attempts:
          type: integer
          minimum: 0
        succeeded_operations:
          type: integer
          minimum: 0
        failed_operations:
          type: integer
          minimum: 0
        canceled_operations:
          type: integer
          minimum: 0
        deadline_exceeded_operations:
          type: integer
          minimum: 0
        interrupted_operations:
          type: integer
          minimum: 0
        not_started_operations:
          type: integer
          minimum: 0
        known_no_effect_operations:
          type: integer
          minimum: 0
        completed_effect_operations:
          type: integer
          minimum: 0
        unknown_effect_operations:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: [integer, "null"]
          description: Cache reads, or null when any reported usage lacks this breakdown.
        cache_write_input_tokens:
          type: [integer, "null"]
          description: Cache writes, or null when any reported usage lacks this breakdown.
        cache_write_1h_input_tokens:
          type: [integer, "null"]
          description: One-hour cache writes, or null when any reported usage lacks this breakdown.
        cache_hit_rate:
          type: [number, "null"]
      required:
        - usage_events
        - reported_usage_events
        - logical_operations
        - actual_attempts
        - succeeded_operations
        - failed_operations
        - canceled_operations
        - deadline_exceeded_operations
        - interrupted_operations
        - not_started_operations
        - known_no_effect_operations
        - completed_effect_operations
        - unknown_effect_operations
        - input_tokens
        - output_tokens
        - cached_input_tokens
        - cache_write_input_tokens
        - cache_write_1h_input_tokens
        - cache_hit_rate
    DailyUsage:
      type: object
      properties:
        date:
          type: string
          format: date
        usage_events:
          type: integer
          minimum: 0
        reported_usage_events:
          type: integer
          minimum: 0
        logical_operations:
          type: integer
          minimum: 0
        actual_attempts:
          type: integer
          minimum: 0
        succeeded_operations:
          type: integer
          minimum: 0
        failed_operations:
          type: integer
          minimum: 0
        canceled_operations:
          type: integer
          minimum: 0
        deadline_exceeded_operations:
          type: integer
          minimum: 0
        interrupted_operations:
          type: integer
          minimum: 0
        not_started_operations:
          type: integer
          minimum: 0
        known_no_effect_operations:
          type: integer
          minimum: 0
        completed_effect_operations:
          type: integer
          minimum: 0
        unknown_effect_operations:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: [integer, "null"]
          description: Cache reads, or null when any reported usage lacks this breakdown.
        cache_write_input_tokens:
          type: [integer, "null"]
          description: Cache writes, or null when any reported usage lacks this breakdown.
        cache_write_1h_input_tokens:
          type: [integer, "null"]
          description: One-hour cache writes, or null when any reported usage lacks this breakdown.
      required:
        - date
        - usage_events
        - reported_usage_events
        - logical_operations
        - actual_attempts
        - succeeded_operations
        - failed_operations
        - canceled_operations
        - deadline_exceeded_operations
        - interrupted_operations
        - not_started_operations
        - known_no_effect_operations
        - completed_effect_operations
        - unknown_effect_operations
        - input_tokens
        - output_tokens
        - cached_input_tokens
        - cache_write_input_tokens
        - cache_write_1h_input_tokens
    UsageAnalysis:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/UsageSummary"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyUsage"
      required: [summary, daily]
    Sandbox:
      type: object
      properties:
        mode:
          type: string
        network:
          type: string
        bash_available:
          type: boolean
        summary:
          type: string
        inert_read_paths:
          type: array
          description: Configured read_paths entries that lie below no denied path and change nothing. Present only when non-empty.
          items:
            type: string
        skipped_deny_paths:
          type: array
          description: Built-in read denylist entries (as ~/ paths) that contain a writable root and are not applied. Present only when non-empty.
          items:
            type: string
    WorkspaceReload:
      type: object
      description: One workspace's own POST /v1/sandbox/reload outcome. Exactly one of sandbox or error is present.
      properties:
        workspace:
          type: string
        sandbox:
          $ref: "#/components/schemas/Sandbox"
        error:
          type: string
      required: [workspace]
    SandboxReload:
      description: >
        POST /v1/sandbox/reload's response when more than one workspace is
        loaded. The top-level mode/network/bash_available/summary fields are
        still the startup workspace's own outcome, unchanged from the
        single-workspace Sandbox response; workspaces lists every host that
        was reloaded, startup first, each naming its own path.
      allOf:
        - $ref: "#/components/schemas/Sandbox"
        - type: object
          properties:
            workspaces:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceReload"
          required: [workspaces]
    SharedApproval:
      type: object
      properties:
        schema_version: {type: integer, const: 1}
        id: {type: string}
        revision: {type: integer, minimum: 1}
        kind: {type: string, enum: [authorization, confirmation]}
        scope:
          type: object
          properties:
            workspace: {type: string}
            session_id: {type: string}
            task_id: {type: string}
            run_id: {type: string}
        subject:
          type: object
          properties:
            source: {type: string}
            id: {type: string}
            version: {type: string}
            tool_call_id: {type: string}
            details: {type: string}
        title: {type: string}
        reason: {type: string}
        persistent: {type: boolean}
        blocking: {type: boolean}
        state: {type: string, enum: [pending, approved, rejected, withdrawn, expired, superseded]}
        application: {type: string, enum: [not_required, not_started, applying, applied, failed, unknown]}
        application_error: {type: string}
        created_at: {type: integer}
        expires_at: {type: [integer, 'null']}
        decision: {type: [object, 'null']}
        options:
          type: array
          items:
            type: object
            properties:
              id: {type: string, enum: [approve, reject]}
              label: {type: string}
              scope: {type: string, enum: [once, persistent]}
      required: [id, revision, kind, scope, subject, title, reason, state, application]
    SharedApprovalDecision:
      type: object
      additionalProperties: false
      properties:
        session_id: {type: string}
        revision: {type: integer, minimum: 1}
        option_id: {type: string, enum: [approve, reject, withdraw]}
        feedback: {type: string, maxLength: 8192}
      required: [session_id, revision, option_id]
    ApprovalDecision:
      type: object
      properties:
        decision:
          type: string
          enum: [allow, deny]
        always:
          type: boolean
          description: >
            Valid only with allow (400 with deny). Also excludes the waiting
            command from the sandbox, writing an excluded_commands entry to the
            configuration file, as /approve <id> always does. A command that
            cannot be excluded fails with 400 approval_always_failed and the
            approval keeps waiting.
      required: [decision]
    ApprovalResponse:
      type: object
      properties:
        decision:
          type: string
          enum: [allow, deny]
        always:
          type: boolean
          description: Present and true only when the request set always.
        followup:
          type: string
          description: Present only when the request set always. The prompt a client submits so the model retries the command.
      required: [decision]
    SandboxChangeRequest:
      type: object
      properties:
        change:
          type: string
          enum: [allow_read_path, network, exclude_command]
        value:
          type: string
          description: A path for allow_read_path, allow or deny for network, a command pattern for exclude_command.
      required: [change, value]
    SandboxChange:
      description: >
        The Sandbox (or SandboxReload) object after the change, with three
        more fields. change_summary describes the change, config_path is the
        configuration file that now holds it, and followup is the prompt a
        client submits so the model retries a command the sandbox refused (null
        for network deny).
      allOf:
        - $ref: "#/components/schemas/Sandbox"
        - type: object
          properties:
            workspaces:
              type: array
              items:
                $ref: "#/components/schemas/WorkspaceReload"
            change_summary: {type: string}
            config_path: {type: string}
            followup: {type: [string, "null"]}
          required: [change_summary, config_path, followup]
    Compaction:
      type: object
      description: The compaction_completed event payload, also returned by POST /v1/sessions/{id}/compact.
      properties:
        checkpoint_id:
          type: string
        reason:
          type: string
          enum: [manual, threshold, overflow]
        tokens_before:
          type: integer
        estimated_tokens_after:
          type: integer
        automatic:
          type: boolean
        usage:
          $ref: "#/components/schemas/Usage"
        noop:
          type: boolean
      required: [reason, tokens_before, estimated_tokens_after, automatic, noop]
    SessionTurn:
      type: [object, "null"]
      properties:
        id:
          type: string
        trigger:
          type: string
          enum: [user, task, recovery]
        status:
          type: string
          enum: [running, ok, error, canceled]
    Session:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        workspace:
          type: string
        provider:
          type: string
          description: Provider name from the model selector.
        provider_type:
          type: string
          enum: [claude, openai-compatible, chatgpt]
        model:
          type: string
          description: Model ID the provider API receives.
        thinking:
          type: string
        context_window:
          type: integer
        usage:
          $ref: "#/components/schemas/Usage"
        context_input_tokens:
          type: integer
        sandbox:
          $ref: "#/components/schemas/Sandbox"
        turn:
          $ref: "#/components/schemas/SessionTurn"
        forked_from:
          $ref: "#/components/schemas/ForkedFrom"
        plan:
          type: array
          description: The session plan the model keeps with update_plan. Omitted when there is none.
          items:
            $ref: "#/components/schemas/PlanStep"
      required: [id, workspace, provider, model, thinking, sandbox, turn]
    PlanStep:
      type: object
      properties:
        text:
          type: string
          maxLength: 200
        status:
          type: string
          enum: [pending, in_progress, completed]
      required: [text, status]
    ForkedFrom:
      type: object
      description: Where a forked session came from. Omitted for a session that is not a fork.
      properties:
        session_id:
          type: string
          description: The source session.
        entry_id:
          type: string
          description: The user message the fork stops before. Omitted for a fork of the whole history.
      required: [session_id]
    ForkedSession:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          properties:
            prompt:
              type: string
              description: The text of the message the fork stops before, for the editor. Omitted for a fork of the whole history.
    ForkPoint:
      type: object
      properties:
        entry_id:
          type: string
          description: The id of a user message that starts a turn; pass it as `before`.
        prompt:
          type: string
      required: [entry_id, prompt]
    SessionListRow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        workspace:
          type: string
        provider:
          type: string
        model:
          type: string
        open:
          type: boolean
        last_user_text:
          type: string
          maxLength: 80
          description: The last user message, cut to 80 characters. Omitted when empty.
        modified:
          type: string
          format: date-time
          description: Time of the last write to the session file. Omitted for a session with no file yet.
      required: [id, open]
    SessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionListRow"
      required: [sessions]
    StatusSession:
      type: object
      properties:
        id:
          type: string
        workspace:
          type: string
        turn:
          type: [string, "null"]
          enum: [queued, running, ok, error, canceled, null]
        turn_id:
          type: string
          description: Id of the running or last turn. Omitted when the session has had no turn.
        queued:
          type: integer
          description: Number of turns waiting in the session's queue.
        approvals:
          type: integer
          description: 1 while a turn waits for an approval decision, otherwise 0.
        tasks:
          type: integer
      required: [id, workspace, turn, queued, approvals, tasks]
    StatusSnapshot:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/StatusSession"
      required: [sessions]
    Message:
      type: object
      description: >
        otto_core::model::Message; see crates/otto-core/src/model.rs for the full shape.
        Tool-result blocks may additionally carry optional operation_id, disposition,
        effect_certainty, and stop_reason fields.
    TurnSummary:
      type: object
      properties:
        id:
          type: string
        trigger:
          type: string
          enum: [user, task, recovery]
        status:
          type: string
          enum: [queued, running, ok, error, canceled]
        error:
          type: string
        text:
          type: string
        usage:
          $ref: "#/components/schemas/Usage"
        usage_present:
          type: boolean
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
      required: [id, trigger, status, text, usage, usage_present, started_at]
    Task:
      type: object
      description: app::Task; see crates/otto/src/app/tasks.rs for the full shape.
      properties:
        id:
          type: string
        name:
          type: string
        agent:
          type: string
        description:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        steps:
          type: integer
        tool_calls:
          type: integer
        last_tool:
          type: string
        last_text:
          type: string
        usage:
          $ref: "#/components/schemas/Usage"
        usage_present:
          type: boolean
        result:
          type: string
        error:
          type: string
        session_path:
          type: string
          description: The child session transcript file; omitted when the task runs in memory.
      required: [id, agent, description, status, created_at, steps, tool_calls, usage, usage_present]
    ContextReport:
      type: object
      description: >-
        otto_core::agent::context_report::ContextReport. Token numbers are
        estimates (3 bytes per token plus framing), not tokenizer counts.
      properties:
        model:
          type: string
        context_window:
          type: integer
          description: The provider's hard input ceiling; 0 when not configured.
        compaction_threshold:
          type: integer
          description: The estimate at which automatic compaction runs; 0 when it is off.
        estimated_total:
          type: integer
        reported_input_tokens:
          type: [integer, "null"]
        sections:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [system_prompt, tools, mcp_tools, compaction_summary, memory, messages]
              tokens:
                type: integer
              items:
                type: array
                items:
                  type: object
                  properties:
                    label:
                      type: string
                    tokens:
                      type: integer
                    text:
                      type: string
                  required: [label, tokens, text]
            required: [kind, tokens, items]
      required: [model, context_window, compaction_threshold, estimated_total, reported_input_tokens, sections]
    DeliveryStatus:
      type: object
      required: [approval_id, state, result, error]
      additionalProperties: false
      properties:
        approval_id:
          type: string
        state:
          type: string
          enum: [running, succeeded, failed, canceled, unknown]
        result:
          type: string
        error:
          type: string
    TaskList:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
      required: [tasks]
    Timer:
      type: object
      description: tool::remind::StoredReminder; the record the session sidecar stores.
      properties:
        id:
          type: string
        fire_at:
          type: string
          format: date-time
        message:
          type: string
      required: [id, fire_at, message]
    TimerList:
      type: object
      properties:
        timers:
          type: array
          items:
            $ref: "#/components/schemas/Timer"
      required: [timers]
    McpServer:
      type: object
      description: server::mcp::McpServer; see crates/otto/src/server/mcp.rs for the full shape.
      properties:
        name:
          type: string
        transport:
          type: string
          enum: [stdio, http]
        protocol_version:
          type: [string, "null"]
        state:
          type: string
          enum: [connected, connecting, disabled, needs_login, failed]
        tools:
          type: integer
        error:
          type: [string, "null"]
      required: [name, transport, protocol_version, state, tools, error]
    McpServerList:
      type: object
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/McpServer"
      required: [servers]
    Skill:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        location:
          type: string
      required: [name, description, location]
    SkillList:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
      required: [skills]
    ManagedSkillMetadata:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        directory: {type: string}
        path: {type: string}
        contract:
          anyOf:
            - type: "null"
            - type: object
              properties:
                input: {type: string}
                output: {type: string}
              required: [input, output]
      required: [name, description, directory, path, contract]
    SkillManager:
      type: object
      properties:
        global_enabled:
          type: boolean
          description: Latest persisted skills.enabled (default true). When false, enable it in Otto config and restart; row preferences alone cannot activate skills.
        skills:
          type: array
          items: {$ref: "#/components/schemas/ManagedSkill"}
      required: [global_enabled, skills]
    ManagedSkill:
      type: object
      properties:
        skill: {$ref: "#/components/schemas/ManagedSkillMetadata"}
        enabled:
          type: boolean
          description: Persisted per-skill preference only; execution also requires global_enabled. Not a hot-reloaded state
        loaded:
          type: boolean
          description: Whether this skill belongs to the session's fixed active catalog
      required: [skill, enabled, loaded]
    ManagedSkillInfo:
      type: object
      properties:
        skill: {$ref: "#/components/schemas/ManagedSkillMetadata"}
        body: {type: string, description: Read-only skill instructions, never executed by this endpoint}
        contract_check: {type: [string, "null"]}
      required: [skill, body, contract_check]
    SkillMutation:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        restart_required:
          type: boolean
      required: [name, enabled, restart_required]
    GeneratedSkill:
      type: object
      properties:
        name:
          type: string
        run_id:
          type: string
        session_id:
          type: string
        reason:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        owned:
          type: boolean
          description: False once the file was edited or removed by hand; revert then refuses it
      required: [name, run_id, session_id, reason, created_at, updated_at, owned]
    GeneratedSkillList:
      type: object
      properties:
        enabled:
          type: boolean
          description: False when reflection is turned off; skills is then empty
        skills:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedSkill"
      required: [enabled, skills]
    SkillRevert:
      type: object
      properties:
        name:
          type: string
        result:
          type: string
          enum: [restored, removed]
      required: [name, result]
    NoticeList:
      type: object
      properties:
        notices:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              text:
                type: string
            required: [id, text]
        last:
          type: integer
          description: The newest notice id ever queued for this session; pass it as `after` next time
      required: [notices, last]
    TaskWithHistory:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          properties:
            history:
              type: array
              items:
                $ref: "#/components/schemas/Message"
          required: [history]
    TaskRow:
      type: object
      description: subagent::record::TaskRow; one row from tasks.db, across every otto process on the machine.
      properties:
        parent_session:
          type: string
        task_id:
          type: string
        workspace:
          type: string
        parent_session_path:
          type: string
        name:
          type: string
        agent:
          type: string
        description:
          type: string
        model:
          type: string
        context:
          type: string
        prompt:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled, interrupted]
        created_at:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        steps:
          type: integer
        tool_calls:
          type: integer
        last_tool:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cached_tokens:
          type: integer
        result:
          type: string
        error:
          type: string
        session_path:
          type: string
        cancelable:
          type: boolean
          description: True only when the task belongs to a session this server owns and is not final.
      required:
        [
          parent_session,
          task_id,
          workspace,
          parent_session_path,
          name,
          agent,
          description,
          model,
          context,
          prompt,
          status,
          created_at,
          started_at,
          finished_at,
          steps,
          tool_calls,
          last_tool,
          input_tokens,
          output_tokens,
          cached_tokens,
          result,
          error,
          session_path,
          cancelable,
        ]
    TaskRowList:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskRow"
        next_before:
          type: string
          description: An exclusive created_at cursor for the next page; empty when there are no older rows.
      required: [tasks, next_before]
    TaskRowDetail:
      type: object
      properties:
        task:
          $ref: "#/components/schemas/TaskRow"
        history:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        transcript_missing:
          type: boolean
      required: [task, history, transcript_missing]
    WireEvent:
      type: object
      description: >
        One SSE frame's data payload; shape depends on the event's type
        (see docs/specs/2026-09-03-agent-server-design.md#wire-events).
      properties:
        approval:
          $ref: '#/components/schemas/SharedApproval'
        type:
          type: string
          enum:
            - approval_changed
            - agent_started
            - agent_finished
            - text_delta
            - tool_call_started
            - tool_call_finished
            - provider_usage
            - compaction_started
            - compaction_planned
            - compaction_completed
            - compaction_warning
            - memory_warning
            - agent_error
            - plan_updated
            - notification
            - user_message
            - approval_requested
            - approval_decided
            - turn_end
        turn_id:
          type: string
        task_id:
          type: string
        text:
          type: string
        tool_name:
          type: string
        tool_call_id:
          type: string
        operation_id:
          type: string
        attempt:
          type: integer
          minimum: 1
        tool_args: {}
        result:
          type: object
          properties:
            content:
              type: string
            is_error:
              type: boolean
            operation_id:
              type: string
            disposition:
              type: string
              enum: [succeeded, error, cancelled, deadline_exceeded, interrupted]
            effect_certainty:
              type: string
              enum: [not_started, known_no_effect, completed, unknown]
            stop_reason:
              type: string
              enum: [user_cancellation, deadline, shutdown, migration, transport_lost, process_lost]
        usage:
          $ref: "#/components/schemas/Usage"
        usage_present:
          type: boolean
        compaction:
          $ref: "#/components/schemas/Compaction"
        plan:
          type: object
          description: compaction_planned only; the compaction plan.
        steps:
          type: array
          description: plan_updated only; the whole session plan, empty when it was cleared.
          items:
            $ref: "#/components/schemas/PlanStep"
        image:
          type: boolean
          description: user_message only; true when the prompt carried an image.
        input_id:
          type: string
          description: user_message only; the input id recorded with the message, absent when none was recorded.
        input_provenance:
          $ref: "#/components/schemas/InputProvenance"
          description: user_message only; the input's origin, absent for inputs recorded without provenance.
        status:
          type: string
          enum: [ok, error, canceled]
          description: turn_end only; the turn's terminal status.
        approval_id:
          type: string
          description: approval_requested and approval_decided.
        command:
          type: string
          description: approval_requested only; the command awaiting a decision.
        justification:
          type: string
          description: approval_requested only.
        decision:
          type: string
          enum: [allow, deny, timeout]
          description: approval_decided only. A timeout is a denial.
        error:
          type: string
          description: Also set on turn_end when status is error.
      required: [type]
    Healthz:
      type: object
      properties:
        status:
          type: string
        sessions_open:
          type: integer
      required: [status, sessions_open]
    Info:
      type: object
      properties:
        workspace:
          type: string
        provider:
          type: string
        provider_type:
          type: string
          enum: [claude, openai-compatible, chatgpt]
        model:
          type: string
        thinking:
          type: string
        sandbox:
          type: string
        models:
          type: array
          description: Configured model selectors, `<provider>/<model_id>`.
          items:
            type: string
      required: [workspace, provider, provider_type, model, thinking, sandbox, models]
    WorkflowStep:
      type: object
      properties:
        id: {type: string}
        kind: {type: string, enum: [agent, approval, handoff]}
        agent: {type: string}
        prompt: {type: string}
        needs:
          type: array
          items: {type: string}
        status:
          type: string
          enum: [pending, ready, running, waiting, succeeded, failed, canceled, interrupted]
        attempt: {type: integer}
        result: {type: string}
        error: {type: string}
        transcript_path: {type: string}
        source_run_id: {type: string, nullable: true}
        source_step_id: {type: string, nullable: true}
        source_attempt: {type: integer, nullable: true}
      required: [id, kind, agent, prompt, needs, status, attempt, result, error, transcript_path, source_run_id, source_step_id, source_attempt]
    WorkflowRun:
      type: object
      properties:
        id: {type: string}
        workflow: {type: string}
        workspace: {type: string}
        profile: {type: string}
        provider: {type: string}
        model: {type: string}
        input: {type: string}
        forked_from_run_id: {type: string, nullable: true}
        forked_from_event_seq: {type: integer, nullable: true}
        forked_from_step_id: {type: string, nullable: true}
        status:
          type: string
          enum: [running, waiting, paused, succeeded, failed, canceled]
        created_at: {type: string}
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
      required: [id, workflow, workspace, profile, provider, model, input, forked_from_run_id, forked_from_event_seq, forked_from_step_id, status, created_at, steps]
    WorkflowRequest:
      type: object
      properties:
        id: {type: string}
        run_id: {type: string}
        step_id: {type: string}
        prompt: {type: string}
        status: {type: string, enum: [pending, approved, rejected, canceled]}
      required: [id, run_id, step_id, prompt, status]
    WorkflowView:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/WorkflowRun"
        requests:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRequest"
      required: [run, requests]
    WorkflowList:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRun"
        next_before:
          type: string
          description: Cursor for the next page; empty on the last page.
      required: [runs, next_before]
    WorkflowEvent:
      type: object
      properties:
        seq: {type: integer}
        run_id: {type: string}
        occurred_at: {type: string, format: date-time}
        kind: {type: string}
        step_id: {type: string}
        status: {type: string}
      required: [seq, run_id, occurred_at, kind, step_id, status]
    DiffFile:
      type: object
      properties:
        path: {type: string}
        old_path:
          type: [string, "null"]
          description: Set only when status is renamed.
        status:
          type: string
          enum: [modified, added, deleted, renamed, untracked]
        binary: {type: boolean}
        patch:
          type: string
          description: The file's hunks without the diff --git header lines. Empty for a binary file or a file past the response's patch-byte limits.
        truncated: {type: boolean}
      required: [path, old_path, status, binary, patch, truncated]
    WorkspaceDiff:
      type: object
      properties:
        workspace: {type: string}
        repository:
          type: boolean
          description: False when the workspace is not inside a git work tree.
        branch:
          type: [string, "null"]
          description: null when detached or before the first commit.
        files:
          type: array
          items:
            $ref: "#/components/schemas/DiffFile"
        truncated:
          type: boolean
          description: True when any file's patch, the response's total patch bytes, or the untracked file count was cut.
      required: [workspace, repository, branch, files, truncated]
    WorkspaceEntry:
      type: object
      properties:
        path: {type: string}
        open_sessions: {type: integer}
        workflows: {type: boolean}
      required: [path, open_sessions, workflows]
    DirListing:
      type: object
      properties:
        path: {type: string, description: The canonical directory listed}
        parent: {type: [string, "null"], description: Its parent, or null when the parent is not browsable}
        roots:
          type: array
          items: {type: string}
        dirs:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              path: {type: string}
            required: [name, path]
      required: [path, parent, roots, dirs]
    WorkspaceList:
      type: object
      properties:
        startup: {type: string}
        roots:
          type: array
          items: {type: string}
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceEntry"
      required: [startup, roots, workspaces]
    ApprovalSettings:
      type: object
      required: [policy, reviewer, revision, mode, automatic, reviewer_active]
      properties:
        policy: { type: string, enum: [on_request, never] }
        reviewer: { type: string, enum: [user, auto_review, bypass] }
        revision: { type: integer, minimum: 1 }
        mode:
          type: string
          enum: [manual, auto, yolo]
          description: Legacy label derived from policy and reviewer.
        automatic:
          type: boolean
          description: Legacy label; true for AUTO, YOLO and `never`.
        reviewer_active:
          type: boolean
          description: False under the `never` policy.
  responses:
    Forbidden:
      description: >
        forbidden: the authenticated client may not perform this operation.
        Every client authenticated today is the owner and is never refused.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    memoryRecordID:
      name: record_id
      in: path
      required: true
      schema:
        type: string
    sessionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    turnID:
      name: turn_id
      in: path
      required: true
      schema:
        type: string
    taskID:
      name: task_id
      in: path
      required: true
      description: Task id or name.
      schema:
        type: string
    timerID:
      name: timer_id
      in: path
      required: true
      description: Timer id, as `remind` and the list route report it.
      schema:
        type: string
    approvalID:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
    workflowID:
      name: id
      in: path
      required: true
      schema:
        type: string
    workflowRequestID:
      name: id
      in: path
      required: true
      schema:
        type: string
    after:
      name: after
      in: query
      required: false
      description: Resume the event stream after this seq number.
      schema:
        type: integer
        minimum: 0
    workflowLimit:
      name: limit
      in: query
      required: false
      description: Page size for the run list; defaults to 50 and is capped at 200.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    workflowBefore:
      name: before
      in: query
      required: false
      description: Return runs created before this cursor (a run's `created_at`).
      schema:
        type: string
paths:
  /v1/approvals:
    get:
      summary: List scoped approvals
      parameters:
        - name: session_id
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Scoped snapshot or changes; event sequence is durable. Snapshot includes requests and cursor.
        "403":
          $ref: "#/components/responses/Forbidden"
        '404':
          description: Session or request not found.
        '503':
          description: Approval storage or domain details unavailable.
  /v1/approvals/events:
    get:
      summary: Events scoped approvals
      parameters:
        - name: session_id
          in: query
          required: true
          schema: {type: string}
        - name: after
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Scoped snapshot or changes; event sequence is durable. Snapshot includes requests and cursor.
        "403":
          $ref: "#/components/responses/Forbidden"
        '404':
          description: Session or request not found.
        '503':
          description: Approval storage or domain details unavailable.
  /v1/approvals/changes:
    get:
      summary: Changes scoped approvals
      parameters:
        - name: session_id
          in: query
          required: true
          schema: {type: string}
        - name: after
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Scoped snapshot or changes; event sequence is durable. Snapshot includes requests and cursor.
        "403":
          $ref: "#/components/responses/Forbidden"
        '404':
          description: Session or request not found.
        '503':
          description: Approval storage or domain details unavailable.
  /v1/approvals/{id}:
    get:
      summary: Get scoped approvals
      parameters:
        - name: session_id
          in: query
          required: true
          schema: {type: string}
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Scoped snapshot or changes; event sequence is durable. Snapshot includes requests and cursor.
        "403":
          $ref: "#/components/responses/Forbidden"
        '404':
          description: Session or request not found.
        '503':
          description: Approval storage or domain details unavailable.
  /v1/approvals/{id}/decision:
    post:
      summary: Decide one exact approval version
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedApprovalDecision'
      responses:
        '200':
          description: Committed decision and current application state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedApproval'
        "403":
          $ref: "#/components/responses/Forbidden"
        '409':
          description: Already decided differently, stale version, expired or unauthorized scope.
  /v1/approvals/{id}/withdraw:
    post:
      summary: Withdraw one exact approval version
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedApprovalDecision'
      responses:
        '200':
          description: Committed decision and current application state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedApproval'
        "403":
          $ref: "#/components/responses/Forbidden"
        '409':
          description: Already decided differently, stale version, expired or unauthorized scope.
  /v1/config/providers:
    get:
      summary: List non-sensitive provider and model settings
      description: >-
        Returns `default_model` and every provider, including the built-in
        providers `claude`, `openai-compatible` and `chatgpt` when they have no
        table. Each provider carries its type, connection field names and
        model tables. Credential values are never returned.
      responses:
        "200":
          description: "{default_model, providers: [{name, type, builtin, base_url?, api_key_env?, api_version?, workspace_id_env?, models: [{model_id, selector, default, thinking?, context_window?, compaction_window?}]}]}"
        "401":
          description: Missing or invalid bearer token when the server listens on TCP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/config/providers/{name}:
    get:
      summary: Get one provider with its model tables
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Provider summary without credential values }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { description: "provider_not_found" }
  /v1/config/models:
    get:
      summary: List model IDs from a provider endpoint
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: "{provider, models: [model ID]} sorted" }
        "400": { description: "invalid_provider (unsupported type) or api_key_unavailable" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { description: "provider_not_found" }
        "501": { description: "models_unsupported: ChatGPT cannot enumerate models" }
        "502": { description: "models_failed: the model endpoint request failed" }
  /v1/config/changes:
    post:
      summary: Preview a typed, non-secret provider or model change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                `kind` is one of set_default_model {model}, set_provider
                {provider, type, base_url?, api_key_env?, api_version?,
                workspace_id_env?}, set_provider_field {provider, field,
                value}, remove_provider {provider}, set_model {model,
                thinking?}, set_model_field {model, field, value} or
                remove_model {model}. `model` is `<provider>/<model_id>`.
                Raw TOML and credential values are not accepted.
      responses:
        "200": { description: "{id, expires_in_seconds, operation, target, field, diff} with a redacted diff and a one-time confirmation token" }
        "400": { description: "invalid_provider, invalid_field or invalid_change" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409": { description: "model_in_use: default_model or approval.reviewer_model selects the provider or model; legacy_profiles_config: the file holds profiles, default_profile or approval.reviewer_profile" }
  /v1/config/changes/{id}:
    post:
      summary: Confirm a one-time provider or model change preview
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Configuration saved; server restart required }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { description: Unknown or already-used confirmation token }
        "409": { description: Configuration changed since preview }
        "410": { description: Confirmation token expired }
    delete:
      summary: Cancel a pending provider or model change preview
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Preview cancelled }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404": { description: Unknown or already-used confirmation token }
  /v1/sessions:
    post:
      summary: Create or resume a session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resume:
                  type: string
                  description: >
                    An existing session id, 32 lowercase hex characters. The
                    session file is looked up in every loaded workspace, not
                    only among the most recent sessions. Any other value is 404.
                    Omit to create a new session.
                workspace:
                  type: string
                  description: An admitted workspace path to create or resume in. Defaults to the startup workspace; loaded if not already.
                request_id:
                  type: string
                  description: Stable retry id for creating a session, scoped to the workspace. Cannot accompany resume.
      responses:
        "201":
          description: New session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "200":
          description: An already-open or resumed session, including a retried creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid JSON body, or workspace not an absolute, existing directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: workspace is outside the startup workspace and configured roots Also `forbidden` when the client may not perform this operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: resume id not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: request_id_conflict when the retry id identifies a different session command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: configuration_required when no model is configured; configure a provider and default model, then restart the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List sessions (disk sessions merged with open sessions)
      parameters:
        - name: workspace
          in: query
          required: false
          schema:
            type: string
          description: Restrict to one admitted workspace, loaded if not already. Omit to list every loaded workspace's sessions.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          description: workspace not an absolute, existing directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: workspace is outside the startup workspace and configured roots Also `forbidden` when the client may not perform this operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: Get a session
      description: >-
        Returns the session, re-opening it first when the server closed it for
        being idle. A session closed by DELETE, or one that never existed,
        answers 404.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not found, or already closed by DELETE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Rename a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "200":
          description: Renamed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid or missing name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A turn is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Cancel any active turn and close the session
      description: >-
        Closes the session for good: no later request re-opens it, unlike a
        session the server closed for being idle. Use POST /v1/sessions with
        `{"resume":"<id>"}` to open it again.
      responses:
        "204":
          description: Closed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/permanent:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    delete:
      summary: Permanently delete an idle session
      description: >-
        Closes the session and deletes its history, sub-agent transcripts,
        sidecars and lease/queue state. This cannot be undone. The id stays
        unavailable in this process afterwards, also when deletion fails part
        way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirm:
                  type: string
                  description: Must equal the session id exactly.
              required: [confirm]
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid body, or `confirm` does not equal the session id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `session_busy`: a turn runs or is queued, an approval waits, native
            work is admitted, the session is pinned or closing, or another process
            holds its lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: I/O failure; the id stays unavailable in this process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Archive an idle session
      description: >-
        Closes the session and moves its file, with sub-agent transcripts, to
        the `archive/` directory beside it, as TUI `/archive` does; timer,
        inbox, input, follow-up and turn sidecars are removed. The session no
        longer appears in GET /v1/sessions and cannot be resumed by id; an
        idempotent create retry for it answers 404. When archiving fails
        before the move, the session stays on disk and can be resumed again.
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived_path:
                    type: string
                    description: The session file's path in the archive directory.
                required: [archived_path]
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `session_busy`: a turn runs or is queued, an approval waits, native
            work is admitted, the session is pinned or closing, or another process
            holds its lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: I/O failure, for example an existing file at the archive destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/fork:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Fork the session into a new one
      description: >-
        Writes a new session whose history is this session's history before
        the turn that `before` starts, opens it and returns it. Without
        `before`, the copy keeps everything up to the last finished turn. The
        source session is not changed. Queued inputs, reminders and sub-agents
        stay with the source.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                before:
                  type: string
                  description: A fork point's `entry_id`.
                request_id:
                  type: string
                  description: Stable retry id for a fork, scoped to the workspace.
      responses:
        "201":
          description: The new session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForkedSession"
        "200":
          description: The original fork returned for a repeated request_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForkedSession"
        "400":
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            `invalid_fork_point`: `before` is not a user message that starts a
            turn on this session's history, or the session has no history yet;
            `request_id_conflict`: the retry id identifies another fork command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/fork-points:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: The prompts the session can be forked before, oldest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fork_points:
                    type: array
                    items:
                      $ref: "#/components/schemas/ForkPoint"
                required: [fork_points]
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/history:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: Session message history
      parameters:
        - name: before_turn
          in: query
          required: false
          description: Return only the messages that existed when this turn started.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open, or before_turn names a turn that is not retained or has not started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/context:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: What the next provider request contains, part by part
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextReport"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The redaction boundary withholds dynamic content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/trace:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: Timeline of the session's turns, provider requests, tool calls, compactions and sub-agents
      description: >-
        otto_core::session::trace::Trace, built from the session file and
        the sub-agent task files. It holds no message or result text; a tool
        label carries an argument preview of at most 60 characters, and a
        sub-agent label the first 40 characters of the task description.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            trace_unavailable: the redaction boundary withholds dynamic
            content, the session is closed or has no file, or the session
            file cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The trace could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/trace/{span_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - name: span_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: The text of one trace span
      description: >-
        otto_core::session::trace::SpanContent: titled text sections, empty
        ones omitted. A turn has input; a provider request input, request
        (token estimates) and reply; a tool arguments and result; a
        compaction summary; a sub-agent prompt and result. The text is the
        session content as stored, which the agent redacts before writing it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open, or no such span
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            trace_unavailable: the redaction boundary withholds dynamic
            content, the session is closed or has no file, or the session
            file cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The trace could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/model:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Run this session on another configured model
      description: >-
        Rebuilds the session's runner on the selected model and returns the
        session. The configuration file is not written, so every other session
        and the next serve start keep their model. The switch makes no model
        request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: A `<provider>/<model_id>` selector.
              required: [model]
      responses:
        "200":
          description: Switched session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Missing, empty, malformed or unknown-provider selector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            turn_active (a turn is running), or model_switch_unavailable
            (the session withholds dynamic content, or policy forbids a
            dynamic model)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/thinking:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Run this session with another thinking level
      description: >-
        Rebuilds the session's runner with the given thinking level and returns
        the session. The configuration file is not written, so every other
        session and the next serve start keep their level. The change makes no
        model request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                thinking:
                  type: string
                  enum: [unset, default, low, medium, high, xhigh, max]
                  description: >-
                    The thinking level; `unset` and `default` clear the
                    session override.
              required: [thinking]
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: invalid_thinking (bad JSON, empty or unknown level)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            turn_active (a turn is running), or model_switch_unavailable
            (the session withholds dynamic content, or policy forbids a
            dynamic model)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/approval-mode:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: The session's approval mode and policy settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSettings"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: approval_mode_failed, the settings could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Select MANUAL, AUTO or YOLO for the session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >
                `mode`, `automatic`, or both when they agree. `automatic`
                true selects AUTO and false selects MANUAL.
              properties:
                mode: { type: string, enum: [manual, auto, yolo] }
                automatic: { type: boolean }
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSettings"
        "400":
          description: Neither field, or `automatic` contradicts `mode`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: approval_mode_failed or approval_policy_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/approval-policy:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: The session's canonical approval policy and reviewer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSettings"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: approval_policy_failed, the settings could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Replace the policy and reviewer at an expected revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, policy, reviewer]
              properties:
                expected_revision: { type: integer, minimum: 1 }
                policy: { type: string, enum: [on_request, never] }
                reviewer: { type: string, enum: [user, auto_review, bypass] }
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalSettings"
        "400":
          description: Missing or unknown fields, or expected_revision is 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: approval_policy_conflict, the revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/approval-events:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - name: after
        in: query
        required: false
        schema: { type: integer, minimum: 0, default: 0 }
        description: Return only events after this cursor
    get:
      summary: Recorded approval requests and decisions of this session, in order
      responses:
        "200":
          description: The session's approval events after the cursor, including review metadata
        "400":
          description: Negative cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: approval_events_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/local-commands:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Run a memory local command without starting a model turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: "`memory` or `remember`"
                args:
                  type: string
                  default: ""
                  description: The command's arguments, for example `list`
      responses:
        "200":
          description: Command output, error flag and the session's local-command receipts
          content:
            application/json:
              schema:
                type: object
                required: [output, error, local_commands]
                properties:
                  output: { type: string }
                  error: { type: boolean }
                  local_commands:
                    type: array
                    items: { type: object }
        "400":
          description: The body is not a local command invocation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: local_command_recording, the receipt could not be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/tasks/observer:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: Bounded snapshot of the parent's live and recorded child tasks
      responses:
        "200":
          description: "`{tasks:[{row,entries,missing}],truncated}`; `truncated` is true when only recent tasks are included"
          content:
            application/json:
              schema:
                type: object
                required: [tasks, truncated]
                properties:
                  tasks:
                    type: array
                    items: { type: object }
                  truncated: { type: boolean }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: observer_unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/approvals/message:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Restricted dialogue while an unapproved request waits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 32000
                channel:
                  type: string
                  enum: [telegram]
                  description: Transient channel context for this dialogue request.
                input_id:
                  $ref: "#/components/schemas/InputId"
                  description: >
                    The client's stable id for this message, reused if it is
                    later recorded as a user input. A malformed id fails with
                    409 approval_failed. Absent means a server-generated id.
                client_source: { $ref: "#/components/schemas/ClientSource" }
      responses:
        "200":
          description: Null if none waits, otherwise a dialogue reply; queued asks the client to queue the original message
          content:
            application/json:
              schema:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [text, queued]
                    properties:
                      text:
                        type: string
                      queued:
                        type: boolean
        "400":
          description: Invalid request
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session
        "409":
          description: Restricted dialogue unavailable or failed
  /v1/sessions/{id}/inputs:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Admit ordinary human input to the active task
      description: >
        Deterministically steers the current task at its next safe provider
        boundary. It never invokes model routing and never silently creates a
        queued turn. An idle disposition requires the caller to explicitly
        start a new turn; approval_pending preserves the approval dialogue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 32000
                input_id: { $ref: "#/components/schemas/InputId" }
                client_source: { $ref: "#/components/schemas/ClientSource" }
      responses:
        "200":
          description: Deterministic admission disposition
          content:
            application/json:
              schema:
                type: string
                enum: [steered, idle, approval_pending]
        "400":
          description: Invalid JSON or text
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session
        "409":
          description: >
            input_admission_failed (admission failed before a disposition
            could be determined) or duplicate_input (the transcript already
            holds this input_id)
        "503":
          description: input_not_persisted; the guidance could not be saved and was not accepted
  /v1/sessions/{id}/tasks/steer:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: List transient steering messages for the active task
      description: >
        Returns messages accepted for the current active run. A queued message
        can be withdrawn; delivered guidance is append-only session history.
        Records are transient and disappear after the run ends or Otto restarts.
      responses:
        "200":
          description: Steering messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SteeringMessage" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session
        "409":
          description: Steering is unavailable for the current session
    post:
      summary: Guide the active task at its next safe provider boundary
      description: >
        Accepts guidance only for the active task in this session. Acceptance
        does not interrupt a provider request or tool call and does not grant
        permission. The response includes the exact queued text and its id;
        delete it before delivery to withdraw it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 32000
                  description: Non-whitespace text, limited to 32000 UTF-8 bytes.
                input_id: { $ref: "#/components/schemas/InputId" }
                client_source: { $ref: "#/components/schemas/ClientSource" }
      responses:
        "200":
          description: Guidance queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SteeringMessage" }
        "400":
          description: Invalid JSON or text
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session
        "409":
          description: task_steer_failed (no active task accepts guidance) or duplicate_input
        "503":
          description: input_not_persisted; the guidance could not be saved and was not accepted
  /v1/sessions/{id}/tasks/steer/{message_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - name: message_id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      summary: Withdraw one queued steering message
      description: >
        Withdraws only a message still queued for the active run. A delivered,
        withdrawn, discarded, unknown, or finished-run message returns 409;
        delivered guidance cannot be removed from append-only history.
      responses:
        "200":
          description: Guidance withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SteeringMessage" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session
        "409":
          description: Guidance is no longer queued for the active task
  /v1/sessions/{id}/tasks/steer/interrupt:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Interrupt the running step and deliver queued guidance
      description: >
        Stops the running provider call or tool call and delivers every queued
        guidance message inside the current turn. The turn continues with the
        next provider call. No request body.
      responses:
        "200":
          description: Interrupt requested
          content:
            application/json:
              schema:
                type: object
                required: [queued_guidance]
                properties:
                  queued_guidance:
                    type: integer
                    minimum: 1
                    description: Number of queued messages that will be delivered
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session
        "409":
          description: >
            The active run has no queued guidance (no_queued_guidance), an
            approval is pending (approval_pending), or the session has no
            runner (task_control_unavailable)
  /v1/sessions/{id}/tasks/control:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Route natural input during an active task
      description: >
        Uses a bounded restricted dialogue to choose guidance or a follow-up.
        Returns null when the input should be handled as an ordinary prompt.
        It cannot run task tools or grant approvals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 32000
                  description: Non-whitespace text, limited to 32000 UTF-8 bytes.
                channel:
                  type: string
                  enum: [telegram]
                  description: Transient channel context for this dialogue request.
                input_id:
                  $ref: "#/components/schemas/InputId"
                  description: >
                    The client's stable id for this message, reused if it is
                    recorded as a user input or guidance. A malformed id fails
                    with 409. Absent means a server-generated id.
                client_source: { $ref: "#/components/schemas/ClientSource" }
      responses:
        "200":
          description: Null when unhandled, otherwise the control dialogue reply and route
          content:
            application/json:
              schema:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [text, queued]
                    properties:
                      text:
                        type: string
                      queued:
                        type: boolean
        "400":
          description: Invalid JSON or text
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session
        "409":
          description: Control dialogue unavailable or failed
  /v1/sessions/{id}/approvals/{approval_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/approvalID"
    post:
      summary: Decide the approval a running turn waits for
      description: >
        The turn that requested the approval (approval_requested frame) is
        waiting for this decision. allow runs the command and continues the
        same turn; deny ends the turn without running it. A turn that gets no
        decision in 10 minutes records decision timeout and continues as a deny. With always set, the command is
        first excluded from the sandbox (see ApprovalDecision).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: The first decision for this approval id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          description: Missing or invalid body, decision is neither allow nor deny, always with deny, or approval_always_failed (the command cannot be excluded from the sandbox)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: approval_decided (a decision for this id was already accepted or it timed out) or approval_failed (unknown id, or no turn waits for it)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/turns:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    post:
      summary: Start a turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: May be empty when image is present.
                image:
                  type: object
                  properties:
                    data:
                      type: string
                      description: Base64-encoded PNG, JPEG, or WebP bytes.
                    mime_type:
                      type: string
                      enum: [image/png, image/jpeg, image/webp]
                  required: [data, mime_type]
                stream:
                  type: boolean
                  default: true
                queue:
                  type: boolean
                  default: false
                  description: >
                    When the session is busy, append the turn to a FIFO queue
                    of at most 16 turns instead of answering 409 turn_active.
                    A queued turn has status queued and no events until it
                    starts.
                channel:
                  type: string
                  enum: [telegram]
                  description: Transient chat channel context for this turn; it is not persisted in session history.
                origin:
                  type: string
                  description: >
                    Where the turn came from: terminal, web, or
                    chat:<platform>:<chat id> with platform telegram.
                    Absent means web. Scheduled items created in this
                    turn are delivered to this origin. A chat origin whose
                    platform differs from channel is rejected with 400.
                input_id: { $ref: "#/components/schemas/InputId" }
                client_source: { $ref: "#/components/schemas/ClientSource" }
                queued_input:
                  type: boolean
                  default: false
                  description: >
                    The client held this input as a follow-up while a task ran;
                    records input_provenance.delivery as queued even if the turn
                    starts immediately. Independent of queue; grants no authority.
              required: [text]
      responses:
        "200":
          description: >
            stream:true (default) returns a text/event-stream of WireEvent
            frames starting at seq 0; stream:false waits for the turn to
            finish and returns its TurnSummary. A user turn's first frame is
            user_message and its last frame is turn_end.
          headers:
            Otto-Turn-Id:
              description: Id of the started or queued turn.
              schema:
                type: string
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/WireEvent"
            application/json:
              schema:
                $ref: "#/components/schemas/TurnSummary"
        "400":
          description: Invalid turn text or image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            turn_active (a turn is running or queued and queue was not set),
            queue_full (16 turns are already queued), or duplicate_input (the
            transcript already holds this input_id; a retry the server still
            remembers returns the original turn instead)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: input_not_persisted (a queued turn could not be saved with the session and was not queued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The turn could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/turns/{turn_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/turnID"
    get:
      summary: Get a turn's summary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session or turn not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/turns/{turn_id}/events:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/turnID"
      - $ref: "#/components/parameters/after"
    get:
      summary: Stream (or resume streaming) a turn's events over SSE
      description: Also honors the Last-Event-ID header as an alternative to ?after=.
      responses:
        "200":
          description: text/event-stream of WireEvent frames
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/WireEvent"
        "400":
          description: after is not a non-negative integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session or turn not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/turns/{turn_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/turnID"
    post:
      summary: Cancel a running or queued turn
      description: >
        A queued turn is removed from the queue and ends canceled with a
        turn_end frame.
      responses:
        "202":
          description: Cancellation requested
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session or turn not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/tasks:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: List a session's sub-agent tasks, in creation order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/deliveries/{approval_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
        description: The delivery approval identifier scoped to this source session.
    get:
      summary: Get a source session's delivery status
      description: >
        Returns a capability-free delivery status. Repository, worktree and
        sandbox details are intentionally never returned.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [delivery]
                properties:
                  delivery:
                    $ref: "#/components/schemas/DeliveryStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Delivery is absent or belongs to another source session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/taskID"
    get:
      summary: Get a task, plus its child session's history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskWithHistory"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session or task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/tasks/{task_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/taskID"
    post:
      summary: Cancel a running task
      responses:
        "200":
          description: Canceled; returns the task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session or task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Task already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/timers:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: List the session's outstanding timers, soonest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimerList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/timers/{timer_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/timerID"
    post:
      summary: Cancel an outstanding timer
      responses:
        "200":
          description: Canceled; returns the timer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timer"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session or timer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/mcp:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: List the session's MCP servers and their connection state, in configuration order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpServerList"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Session not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/memory/records:
    parameters:
      - $ref: "#/components/parameters/sessionID"
    get:
      summary: List memory records of the session's scopes; active records only unless state is given
      parameters:
        - name: scope
          in: query
          description: Scopes to list; current is the user and the session workspace scope, all is every stored scope.
          schema: {type: string, enum: [current, user, workspace, all], default: current}
        - name: state
          in: query
          description: Lifecycle state; repeatable; all selects every state.
          schema: {type: string, enum: [active, needs_review, superseded, retracted, all]}
        - name: kind
          in: query
          description: Record kind; repeatable.
          schema: {type: string}
        - name: label
          in: query
          description: Record label; repeatable.
          schema: {type: string}
        - name: updated_after
          in: query
          description: RFC 3339 time or an age such as 30d, 12h or 45m counted back from now.
          schema: {type: string}
        - name: verified_after
          in: query
          description: RFC 3339 time or an age; not combinable with unverified.
          schema: {type: string}
        - name: unverified
          in: query
          description: Only records never verified.
          schema: {type: boolean}
        - name: review_due
          in: query
          description: Only records whose review deadline has passed.
          schema: {type: boolean}
        - name: limit
          in: query
          description: Page size, 1 to 100.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          description: next_cursor of the previous page.
          schema: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryRecordPage"
        "400":
          description: Invalid query or body (bad_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session, record or candidate (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Memory is not available in the session (memory_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: The selected memory source manages its own records (memory_unsupported)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Remember a record as the human operator (applied immediately, no review)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryRememberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryRecord"
        "400":
          description: Invalid query or body (bad_request)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session, record or candidate (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Memory is not available in the session (memory_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: The selected memory source manages its own records (memory_unsupported)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/sessions/{id}/memory/records/{record_id}:
    parameters:
      - $ref: "#/components/parameters/sessionID"
      - $ref: "#/components/parameters/memoryRecordID"
    get:
      summary: Read one record in any lifecycle state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryRecord"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Unknown session, record or candidate (not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Memory is not available in the session (memory_unavailable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: The selected memory source manages its own records (memory_unsupported)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Forget a record; it becomes a tombstone and later requests carry a forgotten retraction notice
      parameters:
